<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>EMCA Data Session</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    <!-- Предупреждение от Tailwind в консоли - это нормально для режима без сборки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Tiptap styles */
        .ProseMirror p { margin-top: 0.5em; margin-bottom: 0.5em; }
        .ProseMirror-focused { outline: none; }
        /* Cursors */
        .collaboration-cursor__caret { border-left: 2px solid #0d0d0d; margin-left: -1px; margin-right: -1px; pointer-events: none; position: relative; word-break: normal; }
        .collaboration-cursor__label { border-radius: 3px 3px 3px 0; color: #0d0d0d; font-size: 12px; font-style: normal; font-weight: 600; left: -1px; line-height: normal; padding: 0.1rem 0.3rem; position: absolute; top: -1.4em; user-select: none; white-space: nowrap; }
        /* Active playing segment highlight */
        .timecode-segment.active-segment-highlight,
        [data-start].active-segment-highlight {
            background-color: #bfdbfe !important;
            color: #1e3a8a !important;
            box-shadow: 0 0 0 2px #3b82f6;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-[100dvh] flex flex-col overflow-hidden select-none">

    <div id="app" class="flex flex-col h-full max-w-7xl mx-auto w-full p-4 gap-4" v-cloak @click="closePopups">
        
        <!-- СТАРТОВЫЙ ЭКРАН -->
        <div v-if="!isSessionStarted" class="flex flex-col items-center justify-center h-full relative overflow-y-auto">
            
            <div class="absolute top-4 right-4 flex items-center gap-4">
                <a href="https://github.com/alef1986/emca-data-session-explorer" target="_blank" class="text-gray-400 hover:text-gray-700 transition-colors" title="GitHub Repository">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                </a>
                <button @click="toggleLocale" class="text-sm font-bold px-3 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 transition-colors shadow-sm">
                    {{ locale === 'ru' ? 'EN' : 'RU' }}
                </button>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 max-w-lg w-full flex flex-col gap-5 my-8">
                <div class="text-center">
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">EMCA Data Session</h1>
                    <p class="text-gray-500 text-sm">{{ t('start_subtitle') }}</p>
                </div>

                <!-- ВЫБОР РЕЖИМА -->
                <div v-if="!sessionMode" class="flex flex-col gap-3">
                    <button @click="setMode('local')" class="w-full flex items-center gap-3 p-4 rounded-xl border border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-left">
                        <div class="bg-blue-100 text-blue-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">{{ t('mode_local') }}</div>
                            <div class="text-xs text-gray-500">{{ t('mode_local_desc') }}</div>
                        </div>
                    </button>
                    
                    <button @click="setMode('host')" class="w-full flex items-center gap-3 p-4 rounded-xl border border-gray-200 hover:border-amber-500 hover:bg-amber-50 transition-all text-left">
                        <div class="bg-amber-100 text-amber-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632l-.037-.666m0 0a3 3 0 1 1 5.684-1.97m0 0A8.954 8.954 0 0 1 12 15a8.954 8.954 0 0 1 5.684 1.97M12 14.25a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z" /></svg>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">{{ t('mode_host') }}</div>
                            <div class="text-xs text-gray-500">{{ t('mode_host_desc') }}</div>
                        </div>
                    </button>

                    <button @click="setMode('join')" class="w-full flex items-center gap-3 p-4 rounded-xl border border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 transition-all text-left">
                        <div class="bg-emerald-100 text-emerald-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">{{ t('mode_join') }}</div>
                            <div class="text-xs text-gray-500">{{ t('mode_join_desc') }}</div>
                        </div>
                    </button>
                </div>

                <!-- ВВОД ДАННЫХ ДЛЯ ВЫБРАННОГО РЕЖИМА -->
                <div v-else class="flex flex-col gap-4">
                    <button @click="sessionMode = null" class="text-sm text-blue-600 hover:underline flex items-center gap-1 w-max">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                        {{ t('back') }}
                    </button>

                    <div class="flex flex-col mb-1">
                        <label class="text-sm font-medium text-gray-700 mb-1">{{ t('user_name') }} <span class="text-red-500">*</span></label>
                        <input type="text" v-model="userName" :placeholder="t('name_placeholder')" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition-colors" :class="{'border-red-300 bg-red-50': !userName.trim() && highlightErrors}">
                    </div>

                    <div 
                        class="border-2 border-dashed rounded-xl p-4 text-center transition-colors relative cursor-pointer"
                        :class="[
                            isDraggingAudio ? 'border-blue-500 bg-blue-50 scale-[1.02]' : 'hover:bg-gray-50',
                            (!audioUrl && highlightErrors) ? 'border-red-300 bg-red-50' : 'border-gray-300'
                        ]"
                        @click="$refs.audioStartInput.click()"
                        @dragover.prevent="isDraggingAudio = true"
                        @dragleave.prevent="isDraggingAudio = false"
                        @drop.prevent="handleAudioDrop"
                    >
                        <input type="file" ref="audioStartInput" @change="handleStartAudio" class="hidden" accept="audio/*, video/*">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-2" :class="(!audioUrl && highlightErrors) ? 'text-red-400' : 'text-blue-500'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                        <span class="font-medium text-gray-700 block text-sm">{{ t('media_file') }} <span class="text-red-500">*</span></span>
                        <span class="text-xs font-mono mt-1 block truncate" :class="audioUrl ? 'text-green-600' : 'text-gray-400'">
                            {{ audioFileName || t('drag_here') }}
                        </span>
                    </div>

                    <div 
                        v-if="sessionMode === 'local' || sessionMode === 'host'"
                        class="border-2 border-dashed rounded-xl p-4 text-center transition-colors relative cursor-pointer"
                        :class="[
                            isDraggingJson ? 'border-amber-500 bg-amber-50 scale-[1.02]' : 'hover:bg-gray-50',
                            (!localJsonBuffer && highlightErrors) ? 'border-red-300 bg-red-50' : 'border-gray-300'
                        ]"
                        @click="$refs.jsonStartInput.click()"
                        @dragover.prevent="isDraggingJson = true"
                        @dragleave.prevent="isDraggingJson = false"
                        @drop.prevent="handleJsonDrop"
                    >
                        <input type="file" ref="jsonStartInput" @change="handleStartJson" class="hidden" accept=".json,.vtt,.srt">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-2" :class="(!localJsonBuffer && highlightErrors) ? 'text-red-400' : 'text-amber-500'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span class="font-medium text-gray-700 block text-sm">{{ t('json_file') }} <span class="text-red-500">*</span></span>
                        <span class="text-xs font-mono mt-1 block truncate" :class="jsonFileName ? 'text-green-600' : 'text-gray-400'">
                            {{ jsonFileName || t('drag_here') }}
                        </span>
                    </div>

                    <div v-if="sessionMode === 'host' || sessionMode === 'join'" class="flex flex-col gap-3 mt-1 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <div class="flex flex-col">
                            <label class="text-sm font-medium text-gray-700 mb-1">{{ t('room_name') }} <span class="text-red-500">*</span></label>
                            <input type="text" v-model="roomName" :placeholder="t('room_placeholder')" class="px-3 py-1.5 border rounded-md focus:outline-none focus:border-blue-500 font-mono text-sm transition-colors" :class="{'border-red-300 bg-red-50': !roomName.trim() && highlightErrors, 'border-gray-300': roomName.trim() || !highlightErrors}">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-sm font-medium text-gray-700 mb-1">{{ t('room_password') }}</label>
                            <input type="password" v-model="roomPassword" placeholder="••••••••" class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 font-mono text-sm">
                            <p class="text-[10px] text-gray-500 mt-1 leading-tight">{{ t('encryption_hint') }}</p>
                        </div>
                        
                        <div class="flex flex-col pt-2 border-t border-gray-200 mt-1">
                            <label class="text-sm font-medium text-gray-700 mb-1">{{ t('signaling_server') }}</label>
                            <select v-model="serverPreset" class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 text-sm mb-2">
                                <option value="public">{{ t('server_public') }}</option>
                                <option value="custom">{{ t('server_custom') }}</option>
                            </select>
                            <input v-if="serverPreset === 'custom'" type="text" v-model="customServerUrl" :placeholder="t('custom_url')" class="px-3 py-1.5 border rounded-md focus:outline-none focus:border-blue-500 font-mono text-sm transition-colors" :class="{'border-red-300 bg-red-50': (!customServerUrl || customServerUrl.length <= 6) && highlightErrors, 'border-gray-300': customServerUrl.length > 6 || !highlightErrors}">
                        </div>
                    </div>
                
                    <!-- ОШИБКА ПОДКЛЮЧЕНИЯ -->
                    <div v-if="connectionErrorMsg" class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm flex items-start gap-2 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 shrink-0 mt-0.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <span>{{ connectionErrorMsg }}</span>
                    </div>

                    <!-- КНОПКА СТАРТА -->
                    <button 
                        @click="startSession" 
                        :disabled="!isReadyToStart || isConnectingP2P"
                        class="w-full py-3 rounded-xl font-bold text-white transition-all mt-2 shrink-0 flex items-center justify-center gap-2"
                        :class="(isReadyToStart && !isConnectingP2P) ? 'bg-blue-600 hover:bg-blue-700 shadow-md' : 'bg-gray-300 cursor-not-allowed text-gray-500'"
                    >
                        <template v-if="isConnectingP2P">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            {{ t('connecting') }}
                        </template>
                        <template v-else-if="!isReadyToStart">
                            {{ t('fill_required_fields') }}
                        </template>
                        <template v-else>
                            {{ t('start_player') }}
                        </template>
                    </button>
                </div>

                <div class="text-center text-xs text-gray-400 space-y-1 mt-4">
                    <p>Developed as part of the research project at <a href="https://efremov-systems.com/societal/" target="_blank" class="text-blue-500 hover:underline">Efremov Systems</a></p>
                </div>
            </div>
        </div>

        <!-- РАБОЧИЙ ИНТЕРФЕЙС ПЛЕЕРА -->
        <template v-else>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-3 shrink-0 z-20">
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <div class="flex items-center gap-3 relative">
                        <h1 class="text-lg font-semibold">{{ t('title') }}</h1>
                        
                        <!-- P2P STATUS INDICATOR -->
                        <div v-if="sessionMode !== 'local'" class="relative">
                            <button @click.stop="togglePeersList" 
                                 class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border transition-colors cursor-pointer shadow-inner focus:outline-none"
                                 :class="{
                                     'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100': connectionState === 'waiting',
                                     'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100': connectionState === 'connected',
                                     'bg-red-50 text-red-700 border-red-200 hover:bg-red-100': connectionState === 'error',
                                     'bg-gray-50 text-gray-500 border-gray-200 cursor-wait': connectionState === 'connecting'
                                 }">
                                 
                                 <span class="w-2.5 h-2.5 rounded-full" 
                                       :class="{
                                           'bg-amber-500 animate-pulse': connectionState === 'waiting',
                                           'bg-emerald-500': connectionState === 'connected',
                                           'bg-red-500 animate-bounce': connectionState === 'error',
                                           'bg-gray-400 animate-pulse': connectionState === 'connecting'
                                       }"></span>
                                       
                                 <span v-if="connectionState === 'connecting'">{{ t('connecting') }}</span>
                                 <span v-if="connectionState === 'waiting'">{{ t('status_waiting') }} (1)</span>
                                 <span v-if="connectionState === 'connected'">{{ t('status_connected') }} ({{ connectedPeers }})</span>
                                 <span v-if="connectionState === 'error'">{{ t('status_error') }}</span>
                                 
                                 <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 ml-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                            </button>

                            <div v-if="showPeersList" @click.stop class="absolute top-full left-0 mt-2 w-64 bg-white border border-gray-200 shadow-xl rounded-lg overflow-hidden z-50">
                                <div class="px-4 py-2 bg-gray-50 border-b border-gray-100 text-xs font-bold text-gray-500">
                                    {{ t('peers_list') }} ({{ peersList.length }})
                                </div>
                                <ul class="max-h-48 overflow-y-auto">
                                    <li v-for="peer in peersList" :key="peer.id" class="px-4 py-2.5 border-b border-gray-50 flex flex-col hover:bg-gray-50 transition-colors">
                                        <div class="flex items-center gap-2">
                                            <span class="w-2 h-2 rounded-full" :class="peer.isMe ? 'bg-blue-500' : 'bg-emerald-500'"></span>
                                            <span class="text-sm font-semibold text-gray-800" :class="{'text-blue-700': peer.isMe}">{{ peer.name }}</span>
                                            <span v-if="peer.isMe" class="text-[10px] bg-blue-100 text-blue-800 px-1.5 rounded">{{ t('you') }}</span>
                                        </div>
                                        <span class="text-[10px] text-gray-400 font-mono ml-4">ID: {{ peer.id }}</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- ИНФОРМАЦИОННЫЙ БЛОК: КОМНАТА И ПАРОЛЬ -->
                        <div v-if="sessionMode !== 'local'" class="flex items-center gap-1.5 text-xs">
                            <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-blue-50 text-blue-800 border border-blue-200 font-medium shadow-xs" :title="roomName">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-blue-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                                <span class="text-blue-600 font-semibold">{{ t('room_label') }}:</span>
                                <span class="font-mono max-w-[120px] truncate">{{ roomName }}</span>
                            </div>
                            <template v-if="sessionMode === 'host'">
                                <div v-if="roomPassword && roomPassword.trim()" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 text-amber-900 border border-amber-200 font-medium shadow-xs">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                                    <span class="text-amber-700 font-semibold">{{ t('password_label') }}:</span>
                                    <span class="font-mono tracking-wider">{{ showRoomPassword ? roomPassword.trim() : '••••' }}</span>
                                    <button @click.stop="showRoomPassword = !showRoomPassword" class="p-0.5 rounded text-amber-700 hover:text-amber-900 hover:bg-amber-100 transition-colors focus:outline-none ml-0.5" :title="showRoomPassword ? t('hide_password') : t('show_password')">
                                        <svg v-if="showRoomPassword" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" /></svg>
                                        <svg v-else xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                    </button>
                                    <button @click.stop="copyRoomDetails" class="p-0.5 rounded text-amber-700 hover:text-amber-900 hover:bg-amber-100 transition-colors focus:outline-none" :title="isRoomCopied ? t('room_details_copied') : t('copy_room_details')">
                                        <svg v-if="!isRoomCopied" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                        <svg v-else xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                                    </button>
                                </div>
                                <div v-else class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-gray-100 text-gray-500 border border-gray-200 font-medium shadow-xs">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" /></svg>
                                    <span>{{ t('no_password') }}</span>
                                    <button @click.stop="copyRoomDetails" class="p-0.5 rounded text-gray-500 hover:text-gray-700 hover:bg-gray-200 transition-colors focus:outline-none ml-0.5" :title="isRoomCopied ? t('room_details_copied') : t('copy_room_details')">
                                        <svg v-if="!isRoomCopied" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                        <svg v-else xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                                    </button>
                                </div>
                            </template>
                        </div>
                        <span class="text-xs font-normal font-mono bg-gray-100 text-gray-600 px-2 py-1 rounded max-w-[150px] truncate" :title="audioFileName">{{ audioFileName }}</span>

                        <!-- ИНДИКАТОР АВТОСОХРАНЕНИЯ -->
                        <div class="inline-flex items-center justify-center p-1 rounded-md bg-emerald-50 text-emerald-600 border border-emerald-200 shadow-2xs shrink-0 cursor-help" :title="t('autosave_active')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l2 2 4-4" />
                            </svg>
                        </div>

                        <!-- ВЕДОМЫЙ: КНОПКА ПРЕДЛОЖИТЬ ПРАВКИ И ПЛАШКА СТАТУСА -->
                        <div v-if="sessionMode === 'join'" class="flex items-center gap-2">
                            <input 
                                type="file" 
                                ref="proposalFileInput" 
                                accept=".json" 
                                class="hidden" 
                                @change="handleProposalFileChange"
                            >
                            <button 
                                @click="$refs.proposalFileInput.click()" 
                                :disabled="!!activeProposal"
                                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all border flex items-center gap-1.5 shadow-xs"
                                :class="activeProposal ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white border-emerald-600 cursor-pointer'"
                                :title="t('propose_edits_hint')"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                </svg>
                                <span>{{ t('propose_edits') }}</span>
                            </button>

                            <div v-if="activeProposal" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border bg-amber-50 border-amber-200 text-amber-800 animate-pulse">
                                <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                                <span>{{ t('proposal_pending_status') }}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-3">
                        <a href="https://github.com/alef1986/emca-data-session-explorer" target="_blank" class="text-gray-400 hover:text-gray-700 transition-colors" title="GitHub Repository">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                        </a>

                        <button @click="toggleLocale" class="text-xs font-bold px-2.5 py-1.5 rounded border border-gray-300 hover:bg-gray-100 transition-colors">
                            {{ locale === 'ru' ? 'EN' : 'RU' }}
                        </button>
                        
                        <button 
                            @click="toggleLoopMode" 
                            class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors border flex items-center gap-1.5"
                            :class="isLoopMode ? 'bg-purple-600 border-purple-700 text-white shadow-sm' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'"
                            :title="t('loop')"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                            Loop
                        </button>

                        <button @click="togglePlay" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors focus:outline-none flex items-center gap-1.5 shadow-sm">
                            <svg v-if="!isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" /></svg>
                            <svg v-else xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" /></svg>
                            {{ isPlaying ? t('stop') : t('play') }}
                        </button>

                        <div class="flex items-center gap-1.5 text-xs text-gray-600 border-l border-gray-300 pl-3 hidden md:flex">
                            <span class="font-medium">{{ t('freq_range') }}</span>
                            <input type="number" v-model.number="freqMinInput" @keyup.enter="applyFrequencyRange" min="0" step="50" class="w-16 px-1.5 py-1 border border-gray-300 rounded text-center font-mono focus:border-blue-500 focus:outline-none">
                            <span>–</span>
                            <input type="number" v-model.number="freqMaxInput" @keyup.enter="applyFrequencyRange" min="100" step="100" class="w-20 px-1.5 py-1 border border-gray-300 rounded text-center font-mono focus:border-blue-500 focus:outline-none">
                            <span>Hz</span>
                        </div>

                        <div class="flex items-center gap-1.5 text-xs text-gray-600 border-l border-gray-300 pl-3">
                            <span class="font-medium mr-1 hidden md:inline">{{ t('zoom') }}</span>
                            <button @click="zoomOut" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-gray-700 font-bold transition-colors" title="-">-</button>
                            <input type="range" min="10" max="500" v-model="zoomLevel" @input="onZoom" class="w-20 md:w-24 accent-blue-600 cursor-pointer">
                            <button @click="zoomIn" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-gray-700 font-bold transition-colors" title="+">+</button>
                            
                            <button @click="applyFrequencyRange" class="ml-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 px-2.5 py-1 rounded text-xs font-medium transition-colors">
                                {{ t('update_spectrogram') }}
                            </button>
                        </div>
                    </div>
                </div>
                
                <div 
                    class="relative w-full rounded-lg bg-[#1e1e1e] border border-gray-300 overflow-hidden shrink-0"
                    :class="isLoopMode ? 'cursor-crosshair' : (isDraggingWave ? 'cursor-grabbing' : 'cursor-grab')"
                    style="touch-action: none;"
                    @pointerdown="onWavePointerDown"
                    @pointermove="onWavePointerMove"
                    @pointerup="onWavePointerUp"
                    @pointercancel="onWavePointerUp"
                    @wheel="onWaveWheel"
                >
                    <div ref="waveformRef" class="w-full"></div>

                    <div class="absolute left-0 bottom-0 h-[120px] w-16 pointer-events-none flex flex-col justify-between py-1 px-1.5 bg-gradient-to-r from-black/80 via-black/40 to-transparent z-10 font-mono text-[10px] text-gray-200 select-none">
                        <span v-for="(label, idx) in freqLabels" :key="idx" class="leading-none drop-shadow">{{ label }}</span>
                    </div>

                    <div class="absolute right-2 top-1.5 pointer-events-none z-10 text-[11px] font-mono px-2 py-0.5 rounded bg-black/60 text-gray-300">
                        {{ isLoopMode ? t('mode_loop_draw') : t('mode_pan_seek') }}
                    </div>

                    <div v-if="!isAudioReady" class="absolute inset-0 bg-white/90 flex items-center justify-center text-gray-600 z-20">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        {{ t('rendering') }}
                    </div>
                </div>
            </div>

            <!-- БАННЕР ПРЕДЛОЖЕНИЯ СЛИЯНИЯ ДЛЯ ВЕДУЩЕГО -->
            <div 
                v-if="sessionMode === 'host' && activeProposal" 
                class="shrink-0 p-3.5 rounded-xl border transition-all flex flex-wrap items-center justify-between gap-3 shadow-sm"
                :class="activeProposal.status === 'previewing' ? 'bg-amber-50 border-amber-300 text-amber-950' : 'bg-blue-50 border-blue-300 text-blue-950'"
            >
                <div class="flex items-center gap-3">
                    <div 
                        class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
                        :class="activeProposal.status === 'previewing' ? 'bg-amber-200 text-amber-800' : 'bg-blue-200 text-blue-800'"
                    >
                        <svg v-if="activeProposal.status === 'previewing'" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg v-else xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                        </svg>
                    </div>

                    <div class="flex flex-col">
                        <div class="text-sm font-semibold flex items-center gap-2">
                            <span>{{ t('proposal_banner_title', { author: activeProposal.author, fileName: activeProposal.fileName }) }}</span>
                            <span v-if="activeProposal.status === 'previewing'" class="text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">PREVIEW</span>
                        </div>
                        <div class="text-xs opacity-75 mt-0.5">
                            <span v-if="activeProposal.status === 'previewing'">{{ t('preview_banner_notice', { author: activeProposal.author, fileName: activeProposal.fileName }) }}</span>
                            <span v-else>{{ t('proposal_received_hint') }}</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <template v-if="activeProposal.status !== 'previewing'">
                        <button 
                            @click="previewProposal" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-xs cursor-pointer"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <span>{{ t('preview_edits') }}</span>
                        </button>
                        <button 
                            @click="rejectProposal" 
                            class="bg-white hover:bg-red-50 text-red-600 border border-red-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-colors shadow-xs cursor-pointer"
                        >
                            {{ t('reject_immediately') }}
                        </button>
                    </template>

                    <template v-else>
                        <button 
                            @click="acceptProposal" 
                            class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-xs cursor-pointer"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>{{ t('accept_edits') }}</span>
                        </button>
                        <button 
                            @click="rejectProposal" 
                            class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-xs cursor-pointer"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                            <span>{{ t('reject_restore') }}</span>
                        </button>
                    </template>
                </div>
            </div>

            <div class="flex flex-row gap-4 flex-1 min-h-0 overflow-hidden">
                <div class="w-2/3 flex-1 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <h2 class="font-semibold text-lg">{{ t('transcript') }}</h2>
                        <!-- Меню форматирования для Tiptap -->
                        <div class="flex items-center gap-2">
                            <!-- Выключка текста -->
                            <div class="flex items-center bg-gray-100 p-0.5 rounded-lg border border-gray-200">
                                <button 
                                    @click="setAlignment('left')" 
                                    :class="currentAlignment === 'left' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                                    class="p-1.5 rounded-md transition-colors"
                                    :title="t('align_left')"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h10.5m-10.5 5.25h16.5" />
                                    </svg>
                                </button>
                                <button 
                                    @click="setAlignment('justify')" 
                                    :class="currentAlignment === 'justify' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                                    class="p-1.5 rounded-md transition-colors"
                                    :title="t('align_justify')"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                                    </svg>
                                </button>
                            </div>

                            <!-- Галочка подсветки текущего сегмента -->
                            <label class="flex items-center gap-1.5 text-xs text-gray-600 hover:text-gray-900 cursor-pointer select-none px-2 py-1 rounded-lg bg-gray-50 hover:bg-gray-100 border border-gray-200 transition-colors" :title="t('highlight_current_segment')">
                                <input 
                                    type="checkbox" 
                                    v-model="highlightActiveSegment" 
                                    class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                                >
                                <span class="font-medium text-xs">{{ t('highlight_current_segment') }}</span>
                            </label>

                            <!-- Галочка перехода к аудио по клику -->
                            <label class="flex items-center gap-1.5 text-xs text-gray-600 hover:text-gray-900 cursor-pointer select-none px-2 py-1 rounded-lg bg-gray-50 hover:bg-gray-100 border border-gray-200 transition-colors" :title="t('seek_on_click_hint')">
                                <input 
                                    type="checkbox" 
                                    v-model="seekOnClick" 
                                    class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                                >
                                <span class="font-medium text-xs">{{ t('seek_on_click') }}</span>
                            </label>

                            <div class="h-4 w-px bg-gray-300 mx-1"></div>

                            <!-- Кружок выбора цвета подсветки (7 цветов) -->
                            <div class="relative flex items-center">
                                <button 
                                    @mousedown.prevent 
                                    @click.stop="toggleHighlightPicker" 
                                    :disabled="!isTextSelected"
                                    class="w-6 h-6 rounded-full border border-gray-300 transition-all flex items-center justify-center shadow-xs"
                                    :class="isTextSelected ? 'cursor-pointer hover:ring-2 hover:ring-blue-400 ring-offset-1 bg-gradient-to-tr from-yellow-300 via-pink-300 to-blue-300' : 'opacity-35 cursor-not-allowed bg-gray-200'"
                                    :title="isTextSelected ? t('select_color') : t('select_text_to_highlight')"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gray-700 pointer-events-none drop-shadow-xs" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                                    </svg>
                                </button>

                                <!-- Выпадающая палитра из 7 цветов + кнопка сброса -->
                                <div 
                                    v-if="showHighlightPicker" 
                                    @click.stop 
                                    class="absolute top-full right-0 mt-2 p-2 bg-white rounded-xl shadow-xl border border-gray-200 flex items-center gap-1.5 z-50 animate-in fade-in zoom-in-95 duration-100"
                                >
                                    <button 
                                        v-for="color in highlightColors" 
                                        :key="color.hex" 
                                        @mousedown.prevent 
                                        @click="applyHighlight(color.hex)" 
                                        class="w-6 h-6 rounded-full border border-black/10 hover:scale-115 transition-transform shadow-xs focus:outline-none"
                                        :style="{ backgroundColor: color.hex }"
                                        :title="t('color_' + color.name)"
                                    ></button>
                                    <div class="w-px h-4 bg-gray-200 mx-0.5"></div>
                                    <button 
                                        @mousedown.prevent 
                                        @click="clearHighlight" 
                                        class="w-6 h-6 rounded-full border border-red-300 hover:border-red-500 bg-red-50 hover:bg-red-100 text-red-500 hover:text-red-600 flex items-center justify-center transition-all focus:outline-none hover:scale-110 shadow-xs"
                                        :title="t('clear_highlight')"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Кнопка добавления комментария -->
                            <button 
                                @mousedown.prevent 
                                @click="addCommentAtSelection" 
                                :disabled="!isTextSelected"
                                class="px-2.5 py-1 rounded-lg border text-xs font-medium flex items-center gap-1.5 transition-all shadow-xs"
                                :class="isTextSelected ? 'border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 hover:border-amber-400 cursor-pointer' : 'border-gray-200 bg-gray-50 text-gray-300 opacity-40 cursor-not-allowed'"
                                :title="isTextSelected ? t('add_comment') : t('select_text_to_comment')"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                                </svg>
                                <span>{{ t('comment') }}</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Контейнер для Rich Text -->
                    <div class="overflow-y-auto flex-1 pr-3">
                        <div ref="editorRef" class="w-full h-full text-gray-800 select-text" :class="{ 'disable-timecode-cursor': !seekOnClick }" spellcheck="false"></div>
                    </div>
                </div>

                <!-- ПРАВАЯ ПАНЕЛЬ: КОММЕНТАРИИ И ЗАМЕТКИ -->
                <div class="w-1/3 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                    <!-- Заголовок панели -->
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100 shrink-0">
                        <div class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                            </svg>
                            <h2 class="font-semibold text-gray-800 text-base flex items-center gap-2">
                                <span>{{ t('comments') }}</span>
                                <span class="text-xs bg-amber-100 text-amber-800 font-bold py-0.5 px-2 rounded-full">{{ commentsList.length }}</span>
                            </h2>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button 
                                @click="exportWord" 
                                class="text-xs bg-gray-50 hover:bg-gray-100 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg border border-gray-200 flex items-center gap-1.5 transition-colors shadow-xs"
                                :title="t('export_word')"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span>{{ t('export_word') }}</span>
                            </button>
                            <button 
                                @click="exportJson" 
                                class="text-xs bg-gray-50 hover:bg-gray-100 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg border border-gray-200 flex items-center gap-1.5 transition-colors shadow-xs"
                                :title="t('save_json')"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                <span>{{ t('save_json') }}</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Пустое состояние -->
                    <div v-if="commentsList.length === 0" class="flex-1 flex flex-col items-center justify-center text-center p-6 text-gray-400">
                        <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-400 flex items-center justify-center mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                            </svg>
                        </div>
                        <div class="font-medium text-gray-600 text-sm mb-1">{{ t('no_comments') }}</div>
                        <div class="text-xs text-gray-400 max-w-xs leading-relaxed">{{ t('no_comments_desc') }}</div>
                    </div>

                    <!-- Список комментариев -->
                    <div v-else class="flex-1 overflow-y-auto pr-1 space-y-3">
                        <div 
                            v-for="comment in commentsList" 
                            :key="comment.id"
                            :id="'comment-card-' + comment.id"
                            @click="selectComment(comment.id)"
                            class="p-3 rounded-xl border transition-all text-xs bg-white select-text"
                            :class="activeCommentId === comment.id ? 'border-amber-400 ring-2 ring-amber-100 shadow-sm bg-amber-50/10' : 'border-gray-200 hover:border-gray-300'"
                        >
                            <!-- Цитата выделенного текста -->
                            <div 
                                v-if="comment.quote" 
                                @click.stop="jumpToCommentInEditor(comment.id)" 
                                class="mb-2 p-1.5 pl-2 rounded bg-amber-50 border-l-2 border-amber-400 text-gray-700 italic flex items-center justify-between group cursor-pointer hover:bg-amber-100/60 transition-colors"
                                :title="t('jump_to_text')"
                            >
                                <span class="truncate text-[11px] font-mono">“{{ comment.quote }}”</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber-500 opacity-0 group-hover:opacity-100 shrink-0 ml-1 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </div>

                            <!-- Шапка комментария: автор, дата, действия -->
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-1.5">
                                    <div class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-[10px]">
                                        {{ (comment.author || 'U').charAt(0).toUpperCase() }}
                                    </div>
                                    <span class="font-semibold text-gray-800 text-xs">{{ comment.author }}</span>
                                    <span v-if="comment.author === userName" class="text-[10px] bg-blue-50 text-blue-600 px-1 rounded">{{ t('you') }}</span>
                                    <span v-if="isCommentNew(comment.id)" class="text-[9px] bg-emerald-500 text-white font-extrabold px-1.5 py-0.5 rounded shadow-xs tracking-wider">NEW</span>
                                </div>
                                <div class="flex items-center gap-2 text-gray-400">
                                    <span class="text-[10px]">{{ formatCommentTime(comment.createdAt) }}</span>
                                    <div class="flex items-center gap-1">
                                        <button 
                                            @click.stop="startEditComment(comment)" 
                                            class="p-1 hover:text-blue-600 rounded hover:bg-gray-100 transition-colors"
                                            :title="t('edit_comment')"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                            </svg>
                                        </button>
                                        <button 
                                            @click.stop="deleteComment(comment.id)" 
                                            class="p-1 hover:text-red-600 rounded hover:bg-gray-100 transition-colors"
                                            :title="t('delete_comment')"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Тело комментария -->
                            <div v-if="editingCommentId === comment.id" class="space-y-2 mt-1">
                                <textarea 
                                    v-model="editingCommentText" 
                                    rows="2" 
                                    class="w-full text-xs p-2 rounded-lg border border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100 resize-none font-sans"
                                    :placeholder="t('comment_placeholder')"
                                    @keydown.enter.ctrl.prevent="saveCommentEdit(comment.id)"
                                    @keydown.esc="cancelCommentEdit(comment.id)"
                                ></textarea>
                                <div class="flex items-center justify-end gap-1.5">
                                    <button 
                                        @click="cancelCommentEdit(comment.id)" 
                                        class="px-2 py-1 rounded text-gray-500 hover:bg-gray-100 text-[11px] font-medium transition-colors"
                                    >
                                        {{ t('cancel') }}
                                    </button>
                                    <button 
                                        @click="saveCommentEdit(comment.id)" 
                                        class="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-medium transition-colors shadow-xs"
                                    >
                                        {{ t('save') }}
                                    </button>
                                </div>
                            </div>
                            <div v-else class="text-gray-800 text-xs whitespace-pre-wrap leading-relaxed py-0.5">
                                {{ comment.text || '—' }}
                            </div>

                            <!-- Ветка ответов (Replies) -->
                            <div class="mt-2.5 pt-2 border-t border-gray-100 space-y-2">
                                <div v-if="comment.replies && comment.replies.length > 0" class="space-y-1.5 pl-2 border-l border-gray-200">
                                    <div 
                                        v-for="reply in comment.replies" 
                                        :key="reply.id" 
                                        class="group/reply bg-gray-50/70 p-2 rounded-lg text-xs"
                                    >
                                        <div class="flex items-center justify-between text-[10px] text-gray-500 mb-0.5">
                                            <div class="flex items-center gap-1">
                                                <span class="font-semibold text-gray-700">{{ reply.author }}</span>
                                                <span v-if="reply.author === userName" class="text-[9px] bg-blue-50 text-blue-600 px-1 rounded">{{ t('you') }}</span>
                                                <span v-if="isReplyNew(reply.id)" class="text-[8px] bg-emerald-500 text-white font-extrabold px-1 py-0.2 rounded shadow-xs tracking-wider">NEW</span>
                                            </div>
                                            <div class="flex items-center gap-1.5">
                                                <span>{{ formatCommentTime(reply.createdAt) }}</span>
                                                <button 
                                                    @click.stop="deleteReply(comment.id, reply.id)" 
                                                    class="opacity-0 group-hover/reply:opacity-100 text-gray-400 hover:text-red-500 transition-opacity p-0.5"
                                                    :title="t('delete_reply')"
                                                >
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="text-gray-700 whitespace-pre-wrap text-[11px]">{{ reply.text }}</div>
                                    </div>
                                </div>

                                <!-- Форма быстрого ответа -->
                                <div class="flex items-center gap-1 pt-1">
                                    <input 
                                        type="text" 
                                        v-model="replyInputText[comment.id]" 
                                        @keydown.enter.prevent="addReply(comment.id)"
                                        :placeholder="t('reply_placeholder')" 
                                        class="flex-1 text-[11px] px-2 py-1 rounded-md border border-gray-200 focus:outline-none focus:border-blue-400 bg-gray-50/50"
                                    >
                                    <button 
                                        @click="addReply(comment.id)" 
                                        :disabled="!(replyInputText[comment.id] && replyInputText[comment.id].trim())"
                                        class="px-2 py-1 bg-gray-100 hover:bg-blue-600 hover:text-white disabled:opacity-40 disabled:hover:bg-gray-100 disabled:hover:text-inherit rounded-md text-[11px] font-medium transition-colors"
                                        :title="t('send_reply')"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
    
    <script type="module" src="./app.js"></script>
</body>
</html>
