<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMCA Data Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-[100dvh] flex flex-col overflow-hidden select-none">

    <div id="app" class="flex flex-col h-full max-w-7xl mx-auto w-full p-4 gap-4" v-cloak @click="closePopups">
        
        <!-- СТАРТОВЫЙ ЭКРАН -->
        <div v-if="!isSessionStarted" class="flex flex-col items-center justify-center h-full relative overflow-y-auto">
            
            <div class="absolute top-4 right-4 flex items-center gap-4">
                <a href="https://github.com/alef1986/emca-data-session-explorer" target="_blank" class="text-gray-400 hover:text-gray-700 transition-colors" title="GitHub Repository">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                </a>
                <button @click="toggleLocale" class="text-sm font-bold px-3 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 transition-colors shadow-sm">
                    {{ locale === 'ru' ? 'EN' : 'RU' }}
                </button>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 max-w-lg w-full flex flex-col gap-5 my-8">
                <div class="text-center">
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">EMCA Data Session</h1>
                    <p class="text-gray-500 text-sm">{{ t('start_subtitle') }}</p>
                </div>

                <!-- ВЫБОР РЕЖИМА -->
                <div v-if="!sessionMode" class="flex flex-col gap-3">
                    <button @click="setMode('local')" class="w-full flex items-center gap-3 p-4 rounded-xl border border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-left">
                        <div class="bg-blue-100 text-blue-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">{{ t('mode_local') }}</div>
                            <div class="text-xs text-gray-500">{{ t('mode_local_desc') }}</div>
                        </div>
                    </button>
                    
                    <button @click="setMode('host')" class="w-full flex items-center gap-3 p-4 rounded-xl border border-gray-200 hover:border-amber-500 hover:bg-amber-50 transition-all text-left">
                        <div class="bg-amber-100 text-amber-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632l-.037-.666m0 0a3 3 0 1 1 5.684-1.97m0 0A8.954 8.954 0 0 1 12 15a8.954 8.954 0 0 1 5.684 1.97M12 14.25a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z" /></svg>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">{{ t('mode_host') }}</div>
                            <div class="text-xs text-gray-500">{{ t('mode_host_desc') }}</div>
                        </div>
                    </button>

                    <button @click="setMode('join')" class="w-full flex items-center gap-3 p-4 rounded-xl border border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 transition-all text-left">
                        <div class="bg-emerald-100 text-emerald-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">{{ t('mode_join') }}</div>
                            <div class="text-xs text-gray-500">{{ t('mode_join_desc') }}</div>
                        </div>
                    </button>
                </div>

                <!-- ВВОД ДАННЫХ ДЛЯ ВЫБРАННОГО РЕЖИМА -->
                <div v-else class="flex flex-col gap-4">
                    <button @click="sessionMode = null" class="text-sm text-blue-600 hover:underline flex items-center gap-1 w-max">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                        {{ t('back') }}
                    </button>

                    <!-- Имя пользователя -->
                    <div class="flex flex-col mb-1">
                        <label class="text-sm font-medium text-gray-700 mb-1">{{ t('user_name') }} <span class="text-red-500">*</span></label>
                        <input type="text" v-model="userName" :placeholder="t('name_placeholder')" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition-colors" :class="{'border-red-300 bg-red-50': !userName.trim() && highlightErrors}">
                    </div>

                    <!-- Медиафайл -->
                    <div 
                        class="border-2 border-dashed rounded-xl p-4 text-center transition-colors relative cursor-pointer"
                        :class="[
                            isDraggingAudio ? 'border-blue-500 bg-blue-50 scale-[1.02]' : 'hover:bg-gray-50',
                            (!audioUrl && highlightErrors) ? 'border-red-300 bg-red-50' : 'border-gray-300'
                        ]"
                        @click="$refs.audioStartInput.click()"
                        @dragover.prevent="isDraggingAudio = true"
                        @dragleave.prevent="isDraggingAudio = false"
                        @drop.prevent="handleAudioDrop"
                    >
                        <input type="file" ref="audioStartInput" @change="handleStartAudio" class="hidden" accept="audio/*, video/*">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-2" :class="(!audioUrl && highlightErrors) ? 'text-red-400' : 'text-blue-500'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                        <span class="font-medium text-gray-700 block text-sm">{{ t('media_file') }} <span class="text-red-500">*</span></span>
                        <span class="text-xs font-mono mt-1 block truncate" :class="audioUrl ? 'text-green-600' : 'text-gray-400'">
                            {{ audioFileName || t('drag_here') }}
                        </span>
                    </div>

                    <!-- JSON Транскрипт -->
                    <div 
                        v-if="sessionMode === 'local' || sessionMode === 'host'"
                        class="border-2 border-dashed rounded-xl p-4 text-center transition-colors relative cursor-pointer"
                        :class="[
                            isDraggingJson ? 'border-amber-500 bg-amber-50 scale-[1.02]' : 'hover:bg-gray-50',
                            (!localJsonBuffer && highlightErrors) ? 'border-red-300 bg-red-50' : 'border-gray-300'
                        ]"
                        @click="$refs.jsonStartInput.click()"
                        @dragover.prevent="isDraggingJson = true"
                        @dragleave.prevent="isDraggingJson = false"
                        @drop.prevent="handleJsonDrop"
                    >
                        <input type="file" ref="jsonStartInput" @change="handleStartJson" class="hidden" accept=".json">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-2" :class="(!localJsonBuffer && highlightErrors) ? 'text-red-400' : 'text-amber-500'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span class="font-medium text-gray-700 block text-sm">{{ t('json_file') }} <span class="text-red-500">*</span></span>
                        <span class="text-xs font-mono mt-1 block truncate" :class="jsonFileName ? 'text-green-600' : 'text-gray-400'">
                            {{ jsonFileName || t('drag_here') }}
                        </span>
                    </div>

                    <!-- Настройки комнаты P2P -->
                    <div v-if="sessionMode === 'host' || sessionMode === 'join'" class="flex flex-col gap-3 mt-1 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <div class="flex flex-col">
                            <label class="text-sm font-medium text-gray-700 mb-1">{{ t('room_name') }} <span class="text-red-500">*</span></label>
                            <input type="text" v-model="roomName" :placeholder="t('room_placeholder')" class="px-3 py-1.5 border rounded-md focus:outline-none focus:border-blue-500 font-mono text-sm transition-colors" :class="{'border-red-300 bg-red-50': !roomName.trim() && highlightErrors, 'border-gray-300': roomName.trim() || !highlightErrors}">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-sm font-medium text-gray-700 mb-1">{{ t('room_password') }}</label>
                            <input type="password" v-model="roomPassword" placeholder="••••••••" class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 font-mono text-sm">
                            <p class="text-[10px] text-gray-500 mt-1 leading-tight">{{ t('encryption_hint') }}</p>
                        </div>
                        
                        <!-- Выбор сигнального сервера -->
                        <div class="flex flex-col pt-2 border-t border-gray-200 mt-1">
                            <label class="text-sm font-medium text-gray-700 mb-1">{{ t('signaling_server') }}</label>
                            <select v-model="serverPreset" class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 text-sm mb-2">
                                <option value="public">{{ t('server_public') }}</option>
                                <option value="custom">{{ t('server_custom') }}</option>
                            </select>
                            <input v-if="serverPreset === 'custom'" type="text" v-model="customServerUrl" :placeholder="t('custom_url')" class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 font-mono text-sm">
                        </div>
                    </div>
                
                    <!-- ОШИБКА ПОДКЛЮЧЕНИЯ (Отображается до старта плеера) -->
                    <div v-if="connectionErrorMsg" class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm flex items-start gap-2 shadow-sm animate-pulse">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 shrink-0 mt-0.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <span>{{ connectionErrorMsg }}</span>
                    </div>

                    <!-- КНОПКА СТАРТА -->
                    <button 
                        @click="startSession" 
                        :disabled="!isReadyToStart || isConnectingP2P"
                        class="w-full py-3 rounded-xl font-bold text-white transition-all mt-2 shrink-0 flex items-center justify-center gap-2"
                        :class="(isReadyToStart && !isConnectingP2P) ? 'bg-blue-600 hover:bg-blue-700 shadow-md' : 'bg-gray-300 cursor-not-allowed text-gray-500'"
                    >
                        <template v-if="isConnectingP2P">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            {{ t('connecting') }}
                        </template>
                        <template v-else-if="!isReadyToStart">
                            {{ t('fill_required_fields') }}
                        </template>
                        <template v-else>
                            {{ t('start_player') }}
                        </template>
                    </button>
                </div>

                <div class="text-center text-xs text-gray-400 space-y-1 mt-4">
                    <p>Developed as part of the research project at <a href="https://efremov-systems.com/societal/" target="_blank" class="text-blue-500 hover:underline">Efremov Systems</a></p>
                </div>
            </div>
        </div>

        <!-- РАБОЧИЙ ИНТЕРФЕЙС ПЛЕЕРА -->
        <template v-else>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-3 shrink-0 z-20">
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <div class="flex items-center gap-3 relative">
                        <h1 class="text-lg font-semibold">{{ t('title') }}</h1>
                        
                        <!-- P2P STATUS INDICATOR -->
                        <div v-if="sessionMode !== 'local'" class="relative">
                            <button @click.stop="togglePeersList" 
                                 class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border transition-colors cursor-pointer shadow-inner focus:outline-none"
                                 :class="{
                                     'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100': connectionState === 'waiting',
                                     'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100': connectionState === 'connected',
                                     'bg-red-50 text-red-700 border-red-200 hover:bg-red-100': connectionState === 'error',
                                     'bg-gray-50 text-gray-500 border-gray-200 cursor-wait': connectionState === 'connecting'
                                 }">
                                 
                                 <span class="w-2.5 h-2.5 rounded-full" 
                                       :class="{
                                           'bg-amber-500 animate-pulse': connectionState === 'waiting',
                                           'bg-emerald-500': connectionState === 'connected',
                                           'bg-red-500 animate-bounce': connectionState === 'error',
                                           'bg-gray-400 animate-pulse': connectionState === 'connecting'
                                       }"></span>
                                       
                                 <span v-if="connectionState === 'connecting'">{{ t('connecting') }}</span>
                                 <span v-if="connectionState === 'waiting'">{{ t('status_waiting') }} (1)</span>
                                 <span v-if="connectionState === 'connected'">{{ t('status_connected') }} ({{ connectedPeers }})</span>
                                 <span v-if="connectionState === 'error'">{{ t('status_error') }}</span>
                                 
                                 <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 ml-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                            </button>

                            <div v-if="showPeersList" @click.stop class="absolute top-full left-0 mt-2 w-64 bg-white border border-gray-200 shadow-xl rounded-lg overflow-hidden z-50">
                                <div class="px-4 py-2 bg-gray-50 border-b border-gray-100 text-xs font-bold text-gray-500">
                                    {{ t('peers_list') }} ({{ peersList.length }})
                                </div>
                                <ul class="max-h-48 overflow-y-auto">
                                    <li v-for="peer in peersList" :key="peer.id" class="px-4 py-2.5 border-b border-gray-50 flex flex-col hover:bg-gray-50 transition-colors">
                                        <div class="flex items-center gap-2">
                                            <span class="w-2 h-2 rounded-full" :class="peer.isMe ? 'bg-blue-500' : 'bg-emerald-500'"></span>
                                            <span class="text-sm font-semibold text-gray-800" :class="{'text-blue-700': peer.isMe}">{{ peer.name }}</span>
                                            <span v-if="peer.isMe" class="text-[10px] bg-blue-100 text-blue-800 px-1.5 rounded">{{ t('you') }}</span>
                                        </div>
                                        <span class="text-[10px] text-gray-400 font-mono ml-4">ID: {{ peer.id }}</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <span class="text-xs font-normal font-mono bg-gray-100 text-gray-600 px-2 py-1 rounded max-w-[150px] truncate" :title="audioFileName">{{ audioFileName }}</span>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-3">
                        <a href="https://github.com/alef1986/emca-data-session-explorer" target="_blank" class="text-gray-400 hover:text-gray-700 transition-colors" title="GitHub Repository">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                        </a>

                        <button @click="toggleLocale" class="text-xs font-bold px-2.5 py-1.5 rounded border border-gray-300 hover:bg-gray-100 transition-colors">
                            {{ locale === 'ru' ? 'EN' : 'RU' }}
                        </button>
                        
                        <button 
                            @click="toggleLoopMode" 
                            class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors border flex items-center gap-1.5"
                            :class="isLoopMode ? 'bg-purple-600 border-purple-700 text-white shadow-sm' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'"
                            :title="t('loop')"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                            Loop
                        </button>

                        <button @click="togglePlay" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors focus:outline-none flex items-center gap-1.5 shadow-sm">
                            <svg v-if="!isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" /></svg>
                            <svg v-else xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" /></svg>
                            {{ isPlaying ? t('stop') : t('play') }}
                        </button>

                        <div class="flex items-center gap-1.5 text-xs text-gray-600 border-l border-gray-300 pl-3 hidden md:flex">
                            <span class="font-medium">{{ t('freq_range') }}</span>
                            <input type="number" v-model.number="freqMinInput" @keyup.enter="applyFrequencyRange" min="0" step="50" class="w-16 px-1.5 py-1 border border-gray-300 rounded text-center font-mono focus:border-blue-500 focus:outline-none">
                            <span>–</span>
                            <input type="number" v-model.number="freqMaxInput" @keyup.enter="applyFrequencyRange" min="100" step="100" class="w-20 px-1.5 py-1 border border-gray-300 rounded text-center font-mono focus:border-blue-500 focus:outline-none">
                            <span>Hz</span>
                        </div>

                        <div class="flex items-center gap-1.5 text-xs text-gray-600 border-l border-gray-300 pl-3">
                            <span class="font-medium mr-1 hidden md:inline">{{ t('zoom') }}</span>
                            <button @click="zoomOut" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-gray-700 font-bold transition-colors" title="-">-</button>
                            <input type="range" min="10" max="500" v-model="zoomLevel" @input="onZoom" class="w-20 md:w-24 accent-blue-600 cursor-pointer">
                            <button @click="zoomIn" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-gray-700 font-bold transition-colors" title="+">+</button>
                            
                            <button @click="applyFrequencyRange" class="ml-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 px-2.5 py-1 rounded text-xs font-medium transition-colors">
                                {{ t('update_spectrogram') }}
                            </button>
                        </div>
                    </div>
                </div>

        const colorSwatches = [

        createApp({
            setup() {
                const locale = ref('ru');
                const t = computed(() => (key) => dictionary[locale.value][key] || key);
                const toggleLocale = () => { locale.value = locale.value === 'ru' ? 'en' : 'ru'; };

                const sessionMode = ref(null); 
                const isSessionStarted = ref(false);
                const isConnectingP2P = ref(false);
                const connectionState = ref('disconnected'); 
                const syncError = ref(false);
                const connectionErrorMsg = ref('');
                const highlightErrors = ref(false);
                
                const audioUrl = ref('');
                const audioFileName = ref('');
                const jsonFileName = ref('');
                
                // Инициализация имени пользователя и очистка localStorage от возможного мусора
                const defaultName = 'User ' + Math.floor(Math.random() * 1000);
                const userName = ref(localStorage.getItem('emca_username') || defaultName);
                
                const roomName = ref('');
                const roomPassword = ref('');
                
                const serverPreset = ref('public');
                const customServerUrl = ref('wss://');
                
                const isDraggingAudio = ref(false);
                const isDraggingJson = ref(false);

                let ydoc = null;
                let provider = null;
                let yTranscript = null;
                const connectedPeers = ref(1);
                const peersList = ref([]);
                const showPeersList = ref(false);

                const transcript = ref([]);
                
                // КЛЮЧЕВОЙ ФИКС: Делаем буфер JSON реактивным
                const localJsonBuffer = ref(null); 

                const currentTime = ref(0);
                const isPlaying = ref(false);
                const isAudioReady = ref(false);
                const zoomLevel = ref(10);
                const zoomStep = 25;
                
                const freqMinInput = ref(0);
                const freqMaxInput = ref(500);
                const freqMin = ref(0);
                const freqMax = ref(500);

                const waveformRef = ref(null);
                const transcriptContainer = ref(null);
                const autoScroll = ref(true);
                
                let ws = null;
                let activeSpectrogramPlugin = null;
                let regionsPlugin = null;
                let activeLoopRegion = null;
                let disableDragSelectionFn = null;
                let zoomRedrawTimer = null;

                const isDraggingWave = ref(false);
                let pointerStartX = 0;
                let initialScrollLeft = 0;
                let wasDragged = false;

                const searchQuery = ref('');
                const searchResults = ref([]);
                const currentSearchIndex = ref(0);
                const hasSearched = ref(false);

                const isLoopMode = ref(false);
                const hasActiveLoop = ref(false);
                let loopTimeout = null;

                const openPickerId = ref(null);

                const activeSignalingServer = computed(() => {
                    return serverPreset.value === 'public' ? 'wss://signaling.yjs.dev' : customServerUrl.value;
                });

                watch(userName, (newVal) => {
                    localStorage.setItem('emca_username', newVal);
                });

                const setMode = (mode) => { sessionMode.value = mode; highlightErrors.value = false; connectionErrorMsg.value = ''; };

                const isReadyToStart = computed(() => {
                    if (!userName.value.trim()) return false;
                    if (sessionMode.value === 'local') return audioUrl.value !== '' && localJsonBuffer.value !== null;
                    if (sessionMode.value === 'host') return audioUrl.value !== '' && localJsonBuffer.value !== null && roomName.value.trim() !== '';
                    if (sessionMode.value === 'join') return audioUrl.value !== '' && roomName.value.trim() !== '';
                    return false;
                });

                const freqLabels = computed(() => {
                    const min = freqMin.value;
                    const max = freqMax.value;
                    const step = (max - min) / 4;
                    const labels = [];
                    for (let i = 4; i >= 0; i--) {
                        const val = Math.round(min + step * i);
                        labels.push(val >= 1000 ? (val / 1000).toFixed(1) + ' kHz' : val + ' Hz');
                    }
                    return labels;
                });

                const processAudioFile = (file) => {
                    if (file) {
                        audioUrl.value = URL.createObjectURL(file);
                        audioFileName.value = file.name;
                    }
                };
                const handleStartAudio = (event) => processAudioFile(event.target.files[0]);
                const handleAudioDrop = (event) => {
                    isDraggingAudio.value = false;
                    const file = event.dataTransfer.files[0];
                    if (file) processAudioFile(file);
                };

                const processJsonFile = (file) => {
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const data = JSON.parse(e.target.result);
                                localJsonBuffer.value = data.map(line => ({
                                    ...line,
                                    note: line.note || '',
                                    color: line.color || ''
                                }));
                                jsonFileName.value = file.name;
                            } catch (err) {
                                alert("Error reading JSON file.");
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                const handleStartJson = (event) => processJsonFile(event.target.files[0]);
                const handleJsonDrop = (event) => {
                    isDraggingJson.value = false;
                    const file = event.dataTransfer.files[0];
                    if (file && file.name.endsWith('.json')) {
                        processJsonFile(file);
                    } else if (file) {
                        alert("Please drop a .json format file.");
                    }
                };

                const updatePeersList = () => {
                    if (!provider) return;
                    const states = provider.awareness.getStates();
                    connectedPeers.value = states.size;
                    
                    const arr = [];
                    states.forEach((state, clientId) => {
                        arr.push({
                            id: clientId,
                            name: state.user?.name || 'Anonymous',
                            isMe: clientId === ydoc.clientID
                        });
                    });
                    
                    arr.sort((a, b) => {
                        if (a.isMe) return -1;
                        if (b.isMe) return 1;
                        return a.name.localeCompare(b.name);
                    });
                    peersList.value = arr;

                    if (connectedPeers.value > 1) {
                        connectionState.value = 'connected';
                        syncError.value = false; 
                    } else {
                        connectionState.value = 'waiting';
                    }
                };
                
                const checkServerConnection = (url) => {
                    return new Promise((resolve, reject) => {
                        const ws = new WebSocket(url);
                        const timeout = setTimeout(() => {
                            ws.close();
                            reject(new Error(t('error_connection')));
                        }, 5000);

                        ws.onopen = () => {
                            clearTimeout(timeout);
                            ws.close();
                            resolve();
                        };

                        ws.onerror = (e) => {
                            clearTimeout(timeout);
                            reject(new Error(t('error_connection')));
                        };
                    });
                };

                const initP2P = async () => {
                    try {
                        const yjsModule = await import('https://esm.sh/yjs@13.6.14?bundle');
                        const webrtcModule = await import('https://esm.sh/y-webrtc@13.0.2?bundle');
                        
                        const Y = yjsModule.default || yjsModule;
                        const WebrtcProvider = webrtcModule.WebrtcProvider;

                        ydoc = new Y.Doc();
                        
                        const providerOpts = { signaling: [activeSignalingServer.value] };
                        if (roomPassword.value.trim() !== '') {
                            providerOpts.password = roomPassword.value.trim();
                        }

                        provider = new WebrtcProvider('emca-p2p-' + roomName.value.trim(), ydoc, providerOpts);

                        provider.awareness.setLocalStateField('user', {
                            name: userName.value.trim() || 'User ' + Math.floor(Math.random() * 1000)
                        });

                        provider.awareness.on('change', updatePeersList);
                        updatePeersList();

                        yTranscript = ydoc.getMap('transcript');

                        yTranscript.observe(() => {
                            const arr = [];
                            yTranscript.forEach((value) => arr.push(value));
                            arr.sort((a, b) => a.id - b.id);
                            transcript.value = arr;
                        });

                        if (localJsonBuffer.value && sessionMode.value === 'host') {
                            ydoc.transact(() => {
                                localJsonBuffer.value.forEach(line => {
                                    yTranscript.set(String(line.id), line);
                                });
                            });
                            localJsonBuffer.value = null; 
                        }
                    } catch (err) {
                        console.error("Failed to load P2P modules:", err);
                        syncError.value = true;
                        throw new Error(t('error_connection'));
                    }
                };

                const applyLineUpdate = (line, updates) => {
                    try {
                        if (sessionMode.value === 'local') {
                            const index = transcript.value.findIndex(l => l.id === line.id);
                            if (index !== -1) {
                                transcript.value[index] = { ...transcript.value[index], ...updates };
                            }
                        } else {
                            if (yTranscript) {
                                const currentLine = yTranscript.get(String(line.id));
                                yTranscript.set(String(line.id), { ...currentLine, ...updates });
                            } else {
                                throw new Error("P2P network object not initialized");
                            }
                        }
                        syncError.value = false;
                    } catch (e) {
                        console.error("Sync error:", e);
                        syncError.value = true;
                        connectionState.value = 'error';
                    }
                };

                const startSession = async () => {
                    highlightErrors.value = true;
                    if (!isReadyToStart.value) return;
                    
                    connectionErrorMsg.value = '';
                    
                    if (sessionMode.value === 'local') {
                        transcript.value = [...localJsonBuffer.value];
                        localJsonBuffer.value = null;
                        isSessionStarted.value = true;
                        nextTick(() => { initPlayer(); });
                    } else {
                        isConnectingP2P.value = true;
                        try {
                            await checkServerConnection(activeSignalingServer.value);
                            await initP2P();
                            connectionState.value = 'waiting';
                            isConnectingP2P.value = false;
                            isSessionStarted.value = true;
                            nextTick(() => { initPlayer(); });
                        } catch (e) {
                            isConnectingP2P.value = false;
                            connectionErrorMsg.value = e.message;
                        }
                    }
                };

                const initSpectrogram = () => {
                    if (!ws) return;
                    if (activeSpectrogramPlugin) {
                        try { activeSpectrogramPlugin.destroy(); } catch (e) {}
                    }
                    activeSpectrogramPlugin = Spectrogram.create({
                        labels: false,
                        height: 120,
                        splitChannels: false,
                        frequencyMin: freqMin.value,
                        frequencyMax: freqMax.value,
                        fftSamples: 2048
                    });
                    ws.registerPlugin(activeSpectrogramPlugin);
                };

                const applyFrequencyRange = () => {
                    let min = Number(freqMinInput.value);
                    let max = Number(freqMaxInput.value);
                    if (isNaN(min) || min < 0) min = 0;
                    if (isNaN(max) || max <= min) max = min + 100;
                    freqMinInput.value = min;
                    freqMaxInput.value = max;
                    freqMin.value = min;
                    freqMax.value = max;
                    initSpectrogram();
                };

                const getScrollContainer = () => {
                    if (!ws) return null;
                    const wrapper = ws.getWrapper();
                    return wrapper ? wrapper.parentElement : null;
                };

                const initPlayer = () => {
                    regionsPlugin = RegionsPlugin.create();

                    ws = WaveSurfer.create({
                        container: waveformRef.value,
                        waveColor: '#60a5fa',
                        progressColor: '#2563eb',
                        cursorColor: '#ef4444',
                        cursorWidth: 2,
                        height: 80,
                        interact: false, 
                        autoCenter: autoScroll.value,
                        url: audioUrl.value,
                        plugins: [regionsPlugin]
                    });

                    initSpectrogram();

                    ws.on('ready', () => { isAudioReady.value = true; });
                    ws.on('play', () => { isPlaying.value = true; });
                    ws.on('pause', () => { isPlaying.value = false; });
                    ws.on('timeupdate', (time) => { currentTime.value = time; });

                    regionsPlugin.on('region-created', (region) => {
                        if (activeLoopRegion && activeLoopRegion !== region) {
                            activeLoopRegion.remove();
                        }
                        activeLoopRegion = region;
                        hasActiveLoop.value = true;
                    });

                    regionsPlugin.on('region-updated', () => {
                        clearTimeout(loopTimeout);
                    });
                };

                const onWaveWheel = (e) => {
                    if (!ws || !isAudioReady.value) return;

                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        if (e.deltaY > 0) zoomOut();
                        else zoomIn();
                    } else {
                        const sc = getScrollContainer();
                        if (sc) {
                            sc.scrollLeft += (e.deltaX !== 0 ? e.deltaX : e.deltaY);
                            e.preventDefault();
                        }
                    }
                };

                const onWavePointerDown = (e) => {
                    if (!ws || !isAudioReady.value || isLoopMode.value) return;
                    isDraggingWave.value = true;
                    wasDragged = false;
                    pointerStartX = e.clientX;
                    const sc = getScrollContainer();
                    initialScrollLeft = sc ? sc.scrollLeft : 0;
                    e.currentTarget.setPointerCapture(e.pointerId);
                };

                const onWavePointerMove = (e) => {
                    if (!isDraggingWave.value || isLoopMode.value || !ws) return;
                    const dx = e.clientX - pointerStartX;
                    if (Math.abs(dx) > 5) {
                        wasDragged = true;
                    }
                    if (wasDragged) {
                        const sc = getScrollContainer();
                        if (sc) sc.scrollLeft = initialScrollLeft - dx;
                    }
                };

                const onWavePointerUp = (e) => {
                    if (!isDraggingWave.value) return;
                    isDraggingWave.value = false;
                    e.currentTarget.releasePointerCapture(e.pointerId);

                    if (!wasDragged && !isLoopMode.value && ws) {
                        const sc = getScrollContainer();
                        const wrapper = ws.getWrapper();
                        if (sc && wrapper) {
                            const rect = sc.getBoundingClientRect();
                            const clickX = e.clientX - rect.left;
                            const scrollX = sc.scrollLeft;
                            const trueX = scrollX + clickX;
                            const totalWidth = wrapper.offsetWidth;
                            
                            if (totalWidth > 0) {
                                const targetRatio = Math.max(0, Math.min(1, trueX / totalWidth));
                                ws.setTime(targetRatio * ws.getDuration());
                            }
                        }
                    }
                    wasDragged = false;
                };

                onUnmounted(() => { 
                    clearTimeout(loopTimeout);
                    clearTimeout(zoomRedrawTimer);
                    if (ws) ws.destroy(); 
                    if (provider) provider.destroy();
                    if (ydoc) ydoc.destroy();
                    if (audioUrl.value) URL.revokeObjectURL(audioUrl.value);
                });

                const togglePlay = () => { 
                    if (!ws) return;
                    if (isPlaying.value) {
                        ws.pause();
                        clearTimeout(loopTimeout);
                    } else {
                        if (isLoopMode.value && activeLoopRegion) {
                            if (currentTime.value < activeLoopRegion.start || currentTime.value >= activeLoopRegion.end) {
                                ws.setTime(activeLoopRegion.start);
                            }
                        }
                        ws.play();
                    }
                };
                
                const zoomIn = () => {
                    zoomLevel.value = Math.min(500, Number(zoomLevel.value) + zoomStep);
                    onZoom();
                };
                
                const zoomOut = () => {
                    zoomLevel.value = Math.max(10, Number(zoomLevel.value) - zoomStep);
                    onZoom();
                };

                const onZoom = () => { 
                    if (!ws) return;
                    ws.zoom(Number(zoomLevel.value));
                    
                    clearTimeout(zoomRedrawTimer);
                    zoomRedrawTimer = setTimeout(() => {
                        initSpectrogram();
                    }, 300);
                };

                const jumpTo = (time) => {
                    if (ws) {
                        ws.setTime(time);
                        if (!isPlaying.value) ws.play();
                    }
                };

                const toggleLoopMode = () => {
                    isLoopMode.value = !isLoopMode.value;
                    clearTimeout(loopTimeout);

                    if (isLoopMode.value) {
                        if (ws && isPlaying.value) ws.pause();
                        if (regionsPlugin) {
                            disableDragSelectionFn = regionsPlugin.enableDragSelection({
                                color: 'rgba(147, 51, 234, 0.35)'
                            });
                        }
                    } else {
                        if (disableDragSelectionFn) {
                            disableDragSelectionFn();
                            disableDragSelectionFn = null;
                        }
                        if (regionsPlugin) {
                            regionsPlugin.clearRegions();
                        }
                        activeLoopRegion = null;
                        hasActiveLoop.value = false;
                    }
                };

                const isLineInLoop = (id) => {
                    if (!isLoopMode.value || !activeLoopRegion) return false;
                    const line = transcript.value.find(l => l.id === id);
                    if (!line) return false;
                    return line.start < activeLoopRegion.end && line.end > activeLoopRegion.start;
                };

                const togglePeersList = () => {
                    showPeersList.value = !showPeersList.value;
                    if (showPeersList.value) openPickerId.value = null;
                };

                const toggleColorPicker = (id) => { 
                    openPickerId.value = openPickerId.value === id ? null : id;
                    if (openPickerId.value) showPeersList.value = false;
                };

                const closePopups = () => {
                    openPickerId.value = null;
                    showPeersList.value = false;
                };

                const setLineColor = (line, colorKey) => {
                    applyLineUpdate(line, { color: colorKey });
                    openPickerId.value = null;
                };

                const toggleBookmark = (line) => {
                    const isBookmarked = !line.is_bookmarked;
                    applyLineUpdate(line, { 
                        is_bookmarked: isBookmarked, 
                        note: (isBookmarked && !line.note) ? '' : line.note 
                    });
                };

                const updateNote = (line, newNote) => {
                    applyLineUpdate(line, { note: newNote });
                };

                const getColorBarClass = (colorKey) => {
                    const found = colorSwatches.find(s => s.key === (colorKey || ''));
                    return found ? found.barClass : colorSwatches[0].barClass;
                };

                const getLineCardClasses = (line) => {
                    const found = colorSwatches.find(s => s.key === (line.color || '')) || colorSwatches[0];
                    return activeLineId.value === line.id ? found.activeCardClass : found.cardClass;
                };

                const formatTime = (seconds) => {
                    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                    const ms = Math.floor((seconds % 1) * 10).toString();
                    return `${m}:${s}.${ms}`;
                };

                const safeScrollToElement = (id) => {
                    const element = document.getElementById(id);
                    const container = transcriptContainer.value;
                    if (element && container) {
                        const containerRect = container.getBoundingClientRect();
                        const elementRect = element.getBoundingClientRect();
                        const targetTop = container.scrollTop + (elementRect.top - containerRect.top) - (containerRect.height / 2) + (elementRect.height / 2);
                        container.scrollTo({ top: targetTop, behavior: 'smooth' });
                    }
                };

                const executeSearch = () => {
                    hasSearched.value = true;
                    const query = searchQuery.value.trim().toLowerCase();
                    if (!query) {
                        searchResults.value = [];
                        return;
                    }
                    searchResults.value = transcript.value.filter(line => 
                        line.text.toLowerCase().includes(query)
                    );
                    if (searchResults.value.length > 0) {
                        currentSearchIndex.value = 0;
                        navigateToSearchResult();
                    }
                };

                const nextSearch = () => {
                    if (searchResults.value.length === 0) return;
                    currentSearchIndex.value = (currentSearchIndex.value + 1) % searchResults.value.length;
                    navigateToSearchResult();
                };

                const prevSearch = () => {
                    if (searchResults.value.length === 0) return;
                    currentSearchIndex.value = (currentSearchIndex.value - 1 + searchResults.value.length) % searchResults.value.length;
                    navigateToSearchResult();
                };

                const navigateToSearchResult = () => {
                    const targetLine = searchResults.value[currentSearchIndex.value];
                    if (targetLine) {
                        const previousAutoScroll = autoScroll.value;
                        autoScroll.value = false;
                        if (ws && isPlaying.value) ws.pause();
                        
                        nextTick(() => {
                            safeScrollToElement('line-' + targetLine.id);
                            setTimeout(() => { autoScroll.value = previousAutoScroll; }, 500);
                        });
                    }
                };

                const isSearchMatch = (id) => {
                    if (searchResults.value.length === 0) return false;
                    return searchResults.value[currentSearchIndex.value].id === id;
                };

                const exportBookmarks = () => {
                    const dataToSave = transcript.value
                        .filter(l => l.is_bookmarked || l.color || l.note) 
                        .map(l => ({
                            id: l.id,
                            start: l.start,
                            end: l.end,
                            text: l.text,
                            is_bookmarked: l.is_bookmarked,
                            note: l.note,
                            color: l.color || ''
                        }));
                    const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'emca_session_notes.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };

                const importBookmarks = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedData = JSON.parse(e.target.result);
                            importedData.forEach(importedLine => {
                                const line = transcript.value.find(l => l.id === importedLine.id);
                                if (line) {
                                    applyLineUpdate(line, {
                                        is_bookmarked: importedLine.is_bookmarked ?? true,
                                        note: importedLine.note || '',
                                        color: importedLine.color || ''
                                    });
                                }
                            });
                        } catch (err) {
                            alert("Error reading JSON file. Check format.");
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                };

                const activeLineId = computed(() => {
                    const line = transcript.value.find(l => currentTime.value >= l.start && currentTime.value <= l.end);
                    return line ? line.id : null;
                });

                const bookmarkedLines = computed(() => transcript.value.filter(l => l.is_bookmarked));

                watch(autoScroll, (newVal) => {
                    if (ws) ws.setOptions({ autoCenter: newVal });
                });

                watch(currentTime, async (newTime) => {
                    if (isLoopMode.value && isPlaying.value && activeLoopRegion) {
                        if (newTime >= activeLoopRegion.end) {
                            ws.pause();
                            loopTimeout = setTimeout(() => {
                                if (isLoopMode.value && activeLoopRegion) {
                                    ws.setTime(activeLoopRegion.start);
                                    ws.play();
                                }
                            }, 1000);
                        }
                    }

                    const currentId = activeLineId.value;
                    if (currentId && autoScroll.value) {
                        await nextTick();
                        safeScrollToElement('line-' + currentId);
                    }
                });

                return {
                    locale,
                    t,
                    toggleLocale,
                    sessionMode,
                    setMode,
                    isSessionStarted,
                    isConnectingP2P,
                    connectionState,
                    syncError,
                    connectionErrorMsg,
                    highlightErrors,
                    audioUrl,
                    audioFileName,
                    jsonFileName,
                    userName,
                    roomName,
                    roomPassword,
                    serverPreset,
                    customServerUrl,
                    isReadyToStart,
                    isDraggingAudio,
                    isDraggingJson,
                    handleStartAudio,
                    handleStartJson,
                    handleAudioDrop,
                    handleJsonDrop,
                    startSession,
                    transcript,
                    connectedPeers,
                    peersList,
                    showPeersList,
                    togglePeersList,
                    currentTime,
                    isPlaying,
                    isAudioReady,
                    zoomLevel,
                    zoomIn,
                    zoomOut,
                    freqMinInput,
                    freqMaxInput,
                    freqLabels,
                    applyFrequencyRange,
                    waveformRef,
                    transcriptContainer,
                    autoScroll,
                    activeLineId,
                    bookmarkedLines,
                    searchQuery,
                    searchResults,
                    currentSearchIndex,
                    hasSearched,
                    isLoopMode,
                    hasActiveLoop,
                    isDraggingWave,
                    onWaveWheel,
                    onWavePointerDown,
                    onWavePointerMove,
                    onWavePointerUp,
                    togglePlay,
                    onZoom,
                    jumpTo,
                    toggleLoopMode,
                    colorSwatches,
                    openPickerId,
                    toggleColorPicker,
                    closePopups,
                    setLineColor,
                    getColorBarClass,
                    getLineCardClasses,
                    toggleBookmark,
                    updateNote,
                    formatTime,
                    executeSearch,
                    nextSearch,
                    prevSearch,
                    isSearchMatch,
                    exportBookmarks,
                    importBookmarks
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
