<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMCA Data Session Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden select-none">

    <div id="app" class="flex flex-col h-full max-w-7xl mx-auto w-full p-4 gap-4" v-cloak @click="closeColorPicker">
        
        <!-- СТАРТОВЫЙ ЭКРАН -->
        <div v-if="!isSessionStarted" class="flex flex-col items-center justify-center h-full relative">
            
            <div class="absolute top-4 right-4">
                <button @click="toggleLocale" class="text-sm font-bold px-3 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 transition-colors shadow-sm">
                    {{ locale === 'ru' ? 'EN' : 'RU' }}
                </button>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 max-w-lg w-full flex flex-col gap-6">
                <div class="text-center">
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">EMCA Data Session</h1>
                    <p class="text-gray-500 text-sm">{{ t('start_subtitle') }}</p>
                </div>

                <div class="flex flex-col gap-4">
                    <!-- Загрузка Аудио -->
                    <div 
                        class="border-2 border-dashed rounded-xl p-4 text-center transition-colors relative cursor-pointer"
                        :class="isDraggingAudio ? 'border-blue-500 bg-blue-50 scale-[1.02]' : 'border-gray-300 hover:bg-gray-50'"
                        @click="$refs.audioStartInput.click()"
                        @dragover.prevent="isDraggingAudio = true"
                        @dragleave.prevent="isDraggingAudio = false"
                        @drop.prevent="handleAudioDrop"
                    >
                        <input type="file" ref="audioStartInput" @change="handleStartAudio" class="hidden" accept="audio/*, video/*">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto text-blue-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                        <span class="font-medium text-gray-700 block">{{ t('media_file') }}</span>
                        <span class="text-xs font-mono mt-1 block" :class="audioUrl ? 'text-green-600' : 'text-gray-400'">
                            {{ audioFileName || t('drag_here') }}
                        </span>
                    </div>

                    <!-- Загрузка JSON -->
                    <div 
                        class="border-2 border-dashed rounded-xl p-4 text-center transition-colors relative cursor-pointer"
                        :class="isDraggingJson ? 'border-amber-500 bg-amber-50 scale-[1.02]' : 'border-gray-300 hover:bg-gray-50'"
                        @click="$refs.jsonStartInput.click()"
                        @dragover.prevent="isDraggingJson = true"
                        @dragleave.prevent="isDraggingJson = false"
                        @drop.prevent="handleJsonDrop"
                    >
                        <input type="file" ref="jsonStartInput" @change="handleStartJson" class="hidden" accept=".json">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto text-amber-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span class="font-medium text-gray-700 block">{{ t('json_file') }}</span>
                        <span class="text-xs font-mono mt-1 block" :class="transcript.length > 0 ? 'text-green-600' : 'text-gray-400'">
                            {{ jsonFileName || t('drag_here') }}
                        </span>
                    </div>
                </div>

                <button 
                    @click="startSession" 
                    :disabled="!isReadyToStart"
                    class="w-full py-3 rounded-xl font-bold text-white transition-all"
                    :class="isReadyToStart ? 'bg-blue-600 hover:bg-blue-700 shadow-md' : 'bg-gray-300 cursor-not-allowed'"
                >
                    {{ t('start_player') }}
                </button>

                <div class="mt-2 text-center text-xs text-gray-400">
                    Developed as part of the research project at 
                    <a href="https://efremov-systems.com/societal/" target="_blank" class="text-blue-500 hover:underline">
                        Efremov Systems
                    </a>
                </div>
            </div>
        </div>

        <!-- РАБОЧИЙ ИНТЕРФЕЙС ПЛЕЕРА -->
        <template v-else>
            <!-- Верхняя панель: Управление, Волновая форма и Спектрограмма -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-3 shrink-0">
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <div class="flex items-center gap-3">
                        <h1 class="text-lg font-semibold">{{ t('title') }}</h1>
                        <span class="text-xs font-normal font-mono bg-gray-100 text-gray-600 px-2 py-1 rounded max-w-[200px] truncate" :title="audioFileName">{{ audioFileName }}</span>
                        <span v-if="isLoopMode" class="text-xs bg-purple-100 text-purple-800 px-2.5 py-1 rounded-full font-medium animate-pulse border border-purple-300">
                            {{ hasActiveLoop ? t('loop_active') : t('draw_loop_hint') }}
                        </span>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-3">
                        <button @click="toggleLocale" class="text-xs font-bold px-2.5 py-1.5 rounded border border-gray-300 hover:bg-gray-100 transition-colors">
                            {{ locale === 'ru' ? 'EN' : 'RU' }}
                        </button>
                        
                        <!-- Кнопка Режима Loop -->
                        <button 
                            @click="toggleLoopMode" 
                            class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors border flex items-center gap-1.5"
                            :class="isLoopMode ? 'bg-purple-600 border-purple-700 text-white shadow-sm' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'"
                            :title="t('loop')"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                            Loop
                        </button>

                        <!-- Плей / Стоп -->
                        <button @click="togglePlay" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors focus:outline-none flex items-center gap-1.5 shadow-sm">
                            <svg v-if="!isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" /></svg>
                            <svg v-else xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" /></svg>
                            {{ isPlaying ? t('stop') : t('play') }}
                        </button>

                        <!-- Настройки частот АЧХ -->
                        <div class="flex items-center gap-1.5 text-xs text-gray-600 border-l border-gray-300 pl-3">
                            <span class="font-medium">{{ t('freq_range') }}</span>
                            <input 
                                type="number" 
                                v-model.number="freqMinInput" 
                                @keyup.enter="applyFrequencyRange"
                                min="0" step="50"
                                class="w-16 px-1.5 py-1 border border-gray-300 rounded text-center font-mono focus:border-blue-500 focus:outline-none"
                                title="Min Hz (Enter)"
                            >
                            <span>–</span>
                            <input 
                                type="number" 
                                v-model.number="freqMaxInput" 
                                @keyup.enter="applyFrequencyRange"
                                min="100" step="100"
                                class="w-20 px-1.5 py-1 border border-gray-300 rounded text-center font-mono focus:border-blue-500 focus:outline-none"
                                title="Max Hz (Enter)"
                            >
                            <span>Hz</span>
                        </div>

                        <!-- Зум и обновление -->
                        <div class="flex items-center gap-2 text-xs text-gray-600 border-l border-gray-300 pl-3">
                            <span class="font-medium">{{ t('zoom') }}</span>
                            <input type="range" min="10" max="500" v-model="zoomLevel" @input="onZoom" class="w-24 accent-blue-600 cursor-pointer">
                            <button @click="applyFrequencyRange" class="bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 px-2.5 py-1 rounded text-xs font-medium transition-colors">
                                {{ t('update_spectrogram') }}
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Контейнер графика с фиксированной шкалой частот и поддержкой тач-перетаскивания -->
                <div 
                    class="relative w-full rounded-lg bg-[#1e1e1e] border border-gray-300 overflow-hidden"
                    :class="isLoopMode ? 'cursor-crosshair' : (isDraggingWave ? 'cursor-grabbing' : 'cursor-grab')"
                    style="touch-action: none;"
                    @pointerdown="onWavePointerDown"
                    @pointermove="onWavePointerMove"
                    @pointerup="onWavePointerUp"
                    @pointercancel="onWavePointerUp"
                >
                    <div ref="waveformRef" class="w-full"></div>

                    <!-- Неисчезающая шкала частот поверх АЧХ (высота 120px снизу) -->
                    <div class="absolute left-0 bottom-0 h-[120px] w-16 pointer-events-none flex flex-col justify-between py-1 px-1.5 bg-gradient-to-r from-black/80 via-black/40 to-transparent z-10 font-mono text-[10px] text-gray-200 select-none">
                        <span v-for="(label, idx) in freqLabels" :key="idx" class="leading-none drop-shadow">{{ label }}</span>
                    </div>

                    <!-- Подсказка режима навигации в правом верхнем углу волны -->
                    <div class="absolute right-2 top-1.5 pointer-events-none z-10 text-[11px] font-mono px-2 py-0.5 rounded bg-black/60 text-gray-300">
                        {{ isLoopMode ? t('mode_loop_draw') : t('mode_pan_seek') }}
                    </div>

                    <div v-if="!isAudioReady" class="absolute inset-0 bg-white/90 flex items-center justify-center text-gray-600 z-20">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        {{ t('rendering') }}
                    </div>
                </div>
            </div>

            <!-- Основная рабочая область (Слева: Транскрипт, Справа: Закладки) -->
            <div class="flex flex-row gap-4 h-full overflow-hidden">
                
                <!-- Левая колонка (2/3): Транскрипт -->
                <div class="w-2/3 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <h2 class="font-semibold text-lg">{{ t('transcript') }}</h2>
                        <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                            <input type="checkbox" v-model="autoScroll" class="rounded text-blue-600 focus:ring-blue-500">
                            {{ t('autoscroll') }}
                        </label>
                    </div>

                    <!-- Поиск -->
                    <div class="flex gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-200">
                        <input type="text" v-model="searchQuery" @keyup.enter="executeSearch" :placeholder="t('search_placeholder')" class="flex-1 px-3 py-1.5 text-sm rounded-md border border-gray-300 focus:outline-none focus:border-blue-500 select-text">
                        <button @click="executeSearch" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 text-sm rounded-md font-medium transition-colors">{{ t('search_button') }}</button>
                        
                        <div class="flex items-center gap-1 border-l border-gray-300 pl-2 ml-1" v-if="searchResults.length > 0">
                            <span class="text-xs text-gray-500 mr-2">{{ currentSearchIndex + 1 }} {{ t('of') }} {{ searchResults.length }}</span>
                            <button @click="prevSearch" class="p-1.5 hover:bg-gray-200 rounded text-gray-600"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
                            <button @click="nextSearch" class="p-1.5 hover:bg-gray-200 rounded text-gray-600"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg></button>
                        </div>
                        <div v-else-if="searchQuery && hasSearched" class="text-xs text-red-500 ml-2">{{ t('not_found') }}</div>
                    </div>

                    <!-- Список субтитров -->
                    <div class="overflow-y-auto flex-1 pr-3 space-y-1.5" ref="transcriptContainer">
                        <div 
                            v-for="line in transcript" :key="line.id" :id="'line-' + line.id"
                            class="group relative flex gap-3 p-2.5 pr-5 rounded-lg transition-all duration-150 border"
                            :class="[
                                getLineCardClasses(line),
                                activeLineId === line.id ? 'ring-2 ring-amber-400 shadow-sm' : '',
                                isSearchMatch(line.id) && activeLineId !== line.id ? 'ring-2 ring-blue-400' : ''
                            ]"
                        >
                            <!-- Номер и иконка закладки -->
                            <div class="flex flex-col items-center gap-2 w-10 shrink-0 pt-0.5">
                                <span class="text-xs font-mono" :class="activeLineId === line.id ? 'text-amber-700 font-bold' : 'text-gray-400'">{{ line.id }}</span>
                                <button @click.stop="toggleBookmark(line)" class="text-gray-300 hover:text-blue-500 focus:outline-none transition-colors" :class="{ '!text-blue-600': line.is_bookmarked }">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M6.32 2.577a49.255 49.255 0 0 1 11.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 0 1-1.085.67L12 18.089l-7.165 3.583A.75.75 0 0 1 3.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93Z" clip-rule="evenodd" /></svg>
                                </button>
                            </div>

                            <!-- Текст субтитра -->
                            <div class="flex-1 cursor-pointer select-text" @click="jumpTo(line.start)">
                                <div class="flex items-center gap-2 text-xs font-mono text-gray-400 mb-1">
                                    <span>{{ formatTime(line.start) }} – {{ formatTime(line.end) }}</span>
                                    <span v-if="activeLineId === line.id" class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                                </div>
                                <p class="text-gray-800 leading-relaxed">{{ line.text }}</p>
                            </div>

                            <!-- Правая цветная полоска для выбора цвета (Пункт 9) -->
                            <div 
                                @click.stop="toggleColorPicker(line.id)"
                                class="w-2.5 rounded-r-lg cursor-pointer transition-all absolute right-0 top-0 bottom-0 hover:w-3.5"
                                :class="getColorBarClass(line.color)"
                                :title="t('color_tag')"
                            ></div>

                            <!-- Всплывающая палитра цветов -->
                            <div 
                                v-if="openPickerId === line.id" 
                                @click.stop
                                class="absolute right-5 top-1/2 -translate-y-1/2 z-30 bg-white shadow-lg border border-gray-200 rounded-lg p-1.5 flex items-center gap-1.5"
                            >
                                <button 
                                    v-for="swatch in colorSwatches" 
                                    :key="swatch.key"
                                    @click="setLineColor(line, swatch.key)"
                                    class="w-5 h-5 rounded-full border transition-transform hover:scale-110 flex items-center justify-center"
                                    :class="[swatch.DotClass, line.color === swatch.key ? 'ring-2 ring-offset-1 ring-gray-700' : 'border-gray-300']"
                                    :title="swatch.key"
                                >
                                    <span v-if="swatch.key === ''" class="text-[10px] text-gray-400">✕</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Правая колонка (1/3): Закладки (Пункт 8) -->
                <div class="w-1/3 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-semibold text-lg flex items-center gap-2">
                            <span>{{ t('bookmarks') }}</span>
                            <span class="text-sm bg-blue-100 text-blue-800 py-0.5 px-2.5 rounded-full">{{ bookmarkedLines.length }}</span>
                        </h2>
                        
                        <div class="flex gap-2">
                            <input type="file" ref="fileInput" @change="importBookmarks" class="hidden" accept=".json">
                            <button @click="$refs.fileInput.click()" class="text-xs bg-gray-100 text-gray-700 hover:bg-gray-200 px-2.5 py-1.5 rounded-lg transition-colors font-medium flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
                                {{ t('load') }}
                            </button>
                            
                            <button v-if="bookmarkedLines.length > 0" @click="exportBookmarks" class="text-xs bg-emerald-100 text-emerald-800 hover:bg-emerald-200 px-2.5 py-1.5 rounded-lg transition-colors font-medium flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                                {{ t('save') }}
                            </button>
                        </div>
                    </div>
                    
                    <div class="overflow-y-auto flex-1 pr-2 space-y-4" v-if="bookmarkedLines.length > 0">
                        <div v-for="line in bookmarkedLines" :key="'bookmark-' + line.id" class="p-3 bg-blue-50/50 rounded-lg border border-blue-100 relative overflow-hidden">
                            <!-- Индикатор цвета в закладке -->
                            <div v-if="line.color" class="absolute right-0 top-0 bottom-0 w-1.5" :class="getColorBarClass(line.color)"></div>
                            
                            <div class="flex justify-between items-start cursor-pointer hover:text-blue-700 transition-colors mb-2 pr-2" @click="jumpTo(line.start)">
                                <div class="text-xs text-blue-600 font-mono font-medium">{{ t('line') }} {{ line.id }}</div>
                                <div class="text-xs text-gray-500 font-mono">{{ formatTime(line.start) }} – {{ formatTime(line.end) }}</div>
                            </div>
                            <p class="text-sm text-gray-700 mb-3 bg-white p-2 rounded border border-gray-100 shadow-sm select-text">{{ line.text }}</p>
                            <textarea v-model="line.note" rows="3" class="w-full text-sm p-2 rounded-md border border-gray-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-y select-text" :placeholder="t('note_placeholder')"></textarea>
                        </div>
                    </div>
                    <div v-else class="text-gray-400 text-sm text-center mt-10">
                        {{ t('no_bookmarks') }}
                    </div>
                </div>

            </div>
        </template>
    </div>

    <style>
        [v-cloak] { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <script type="module">
        import { createApp, ref, computed, watch, nextTick, onUnmounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';
        import Spectrogram from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/spectrogram.esm.js';
        import RegionsPlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.esm.js';

        const dictionary = {
            ru: {
                start_subtitle: 'Выберите файлы сессии или перетащите их сюда',
                media_file: '1. Медиафайл (Аудио/Видео)',
                json_file: '2. Файл транскрипта (.json)',
                drag_here: 'Перетащите файл сюда',
                start_player: 'Запустить плеер',
                title: 'Дата-сессия',
                loop: 'Включить режим выделения области на графике для повтора',
                draw_loop_hint: 'Выделите мышкой/пальцем участок на графике',
                loop_active: 'Активен повтор участка',
                mode_loop_draw: 'Режим Loop: выделите область на графике',
                mode_pan_seek: 'Тяните график для прокрутки • Клик для перехода',
                play: 'Плей',
                stop: 'Стоп',
                freq_range: 'АЧХ:',
                zoom: 'Зум:',
                update_spectrogram: 'Обновить АЧХ',
                rendering: 'Отрисовка аудиоволны и АЧХ...',
                bookmarks: 'Закладки',
                load: 'Загрузить',
                save: 'Сохранить',
                line: 'Строка',
                note_placeholder: 'Ваша аналитическая заметка...',
                no_bookmarks: 'Нет закладок. Сохраненные данные можно загрузить через кнопку.',
                transcript: 'Транскрипт',
                autoscroll: 'Автоскролл',
                search_placeholder: 'Поиск по тексту...',
                search_button: 'Искать',
                of: 'из',
                not_found: 'Ничего не найдено',
                color_tag: 'Выбрать цвет маркера строки'
            },
            en: {
                start_subtitle: 'Select session files or drag and drop them here',
                media_file: '1. Media File (Audio/Video)',
                json_file: '2. Transcript File (.json)',
                drag_here: 'Drag file here',
                start_player: 'Start Player',
                title: 'Data Session',
                loop: 'Toggle region loop mode on waveform',
                draw_loop_hint: 'Drag across the waveform to select a loop region',
                loop_active: 'Region loop active',
                mode_loop_draw: 'Loop Mode: drag on waveform to select region',
                mode_pan_seek: 'Drag waveform to pan • Click/Tap to seek',
                play: 'Play',
                stop: 'Stop',
                freq_range: 'Freq:',
                zoom: 'Zoom:',
                update_spectrogram: 'Update Spectrogram',
                rendering: 'Rendering waveform and spectrogram...',
                bookmarks: 'Bookmarks',
                load: 'Load',
                save: 'Save',
                line: 'Line',
                note_placeholder: 'Your analytical note...',
                no_bookmarks: 'No bookmarks yet. You can load saved data via the button.',
                transcript: 'Transcript',
                autoscroll: 'Autoscroll',
                search_placeholder: 'Search text...',
                search_button: 'Search',
                of: 'of',
                not_found: 'Nothing found',
                color_tag: 'Select line highlight colour'
            }
        };

        const colorSwatches = [
            { key: '', DotClass: 'bg-white', barClass: 'bg-gray-200 group-hover:bg-gray-300', cardClass: 'bg-white border-transparent hover:bg-gray-50', activeCardClass: 'bg-amber-50/90 border-amber-300' },
            { key: 'red', DotClass: 'bg-rose-500', barClass: 'bg-rose-500', cardClass: 'bg-rose-50/70 border-rose-200', activeCardClass: 'bg-rose-100/90 border-amber-400' },
            { key: 'green', DotClass: 'bg-emerald-500', barClass: 'bg-emerald-500', cardClass: 'bg-emerald-50/70 border-emerald-200', activeCardClass: 'bg-emerald-100/90 border-amber-400' },
            { key: 'blue', DotClass: 'bg-sky-500', barClass: 'bg-sky-500', cardClass: 'bg-sky-50/70 border-sky-200', activeCardClass: 'bg-sky-100/90 border-amber-400' },
            { key: 'purple', DotClass: 'bg-purple-500', barClass: 'bg-purple-500', cardClass: 'bg-purple-50/70 border-purple-200', activeCardClass: 'bg-purple-100/90 border-amber-400' },
            { key: 'orange', DotClass: 'bg-orange-500', barClass: 'bg-orange-500', cardClass: 'bg-orange-50/70 border-orange-200', activeCardClass: 'bg-orange-100/90 border-amber-400' },
            { key: 'teal', DotClass: 'bg-teal-500', barClass: 'bg-teal-500', cardClass: 'bg-teal-50/70 border-teal-200', activeCardClass: 'bg-teal-100/90 border-amber-400' }
        ];

        createApp({
            setup() {
                const locale = ref('ru');
                const t = computed(() => (key) => dictionary[locale.value][key] || key);
                const toggleLocale = () => { locale.value = locale.value === 'ru' ? 'en' : 'ru'; };

                const isSessionStarted = ref(false);
                const audioUrl = ref('');
                const audioFileName = ref('');
                const jsonFileName = ref('');
                
                const isDraggingAudio = ref(false);
                const isDraggingJson = ref(false);

                const transcript = ref([]);
                const currentTime = ref(0);
                const isPlaying = ref(false);
                const isAudioReady = ref(false);
                const zoomLevel = ref(10);
                
                // Настройки частот АЧХ (по умолчанию 0 - 500 Гц по запросу коллеги)
                const freqMinInput = ref(0);
                const freqMaxInput = ref(500);
                const freqMin = ref(0);
                const freqMax = ref(500);

                const waveformRef = ref(null);
                const transcriptContainer = ref(null);
                const autoScroll = ref(true);
                
                let ws = null;
                let activeSpectrogramPlugin = null;
                let regionsPlugin = null;
                let activeLoopRegion = null;
                let disableDragSelectionFn = null;
                let zoomRedrawTimer = null;

                // Состояние перетаскивания (Pan) и клика по волне
                const isDraggingWave = ref(false);
                let pointerStartX = 0;
                let initialScrollLeft = 0;
                let wasDragged = false;

                // Состояние поиска
                const searchQuery = ref('');
                const searchResults = ref([]);
                const currentSearchIndex = ref(0);
                const hasSearched = ref(false);

                // Состояние Loop
                const isLoopMode = ref(false);
                const hasActiveLoop = ref(false);
                let loopTimeout = null;

                // Состояние палитры цветов
                const openPickerId = ref(null);

                const isReadyToStart = computed(() => audioUrl.value !== '' && transcript.value.length > 0);

                // Вычисление фиксированных меток частот для наложения слева (5 делений)
                const freqLabels = computed(() => {
                    const min = freqMin.value;
                    const max = freqMax.value;
                    const step = (max - min) / 4;
                    const labels = [];
                    for (let i = 4; i >= 0; i--) {
                        const val = Math.round(min + step * i);
                        labels.push(val >= 1000 ? (val / 1000).toFixed(1) + ' kHz' : val + ' Hz');
                    }
                    return labels;
                });

                const processAudioFile = (file) => {
                    if (file) {
                        audioUrl.value = URL.createObjectURL(file);
                        audioFileName.value = file.name;
                    }
                };

                const handleStartAudio = (event) => processAudioFile(event.target.files[0]);

                const handleAudioDrop = (event) => {
                    isDraggingAudio.value = false;
                    const file = event.dataTransfer.files[0];
                    if (file) processAudioFile(file);
                };

                const processJsonFile = (file) => {
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const data = JSON.parse(e.target.result);
                                transcript.value = data.map(line => ({
                                    ...line,
                                    note: line.note || '',
                                    color: line.color || ''
                                }));
                                jsonFileName.value = file.name;
                            } catch (err) {
                                alert("Error reading JSON file. Check format.");
                            }
                        };
                        reader.readAsText(file);
                    }
                };

                const handleStartJson = (event) => processJsonFile(event.target.files[0]);

                const handleJsonDrop = (event) => {
                    isDraggingJson.value = false;
                    const file = event.dataTransfer.files[0];
                    if (file && file.name.endsWith('.json')) {
                        processJsonFile(file);
                    } else if (file) {
                        alert("Please drop a .json format file.");
                    }
                };

                const startSession = () => {
                    if (isReadyToStart.value) {
                        isSessionStarted.value = true;
                        nextTick(() => { initPlayer(); });
                    }
                };

                // Инициализация / Перерисовка Спектрограммы с учетом границ частот
                const initSpectrogram = () => {
                    if (!ws) return;
                    if (activeSpectrogramPlugin) {
                        try { activeSpectrogramPlugin.destroy(); } catch (e) {}
                    }
                    activeSpectrogramPlugin = Spectrogram.create({
                        labels: false, // Отключаем исчезающие нативные метки в пользу нашего фиксированного оверлея
                        height: 120,
                        splitChannels: false,
                        frequencyMin: freqMin.value,
                        frequencyMax: freqMax.value,
                        fftSamples: 2048 // Повышенная четкость для низких частот (0-500 Гц)
                    });
                    ws.registerPlugin(activeSpectrogramPlugin);
                };

                // Применение новых границ частот по Enter или кнопке
                const applyFrequencyRange = () => {
                    let min = Number(freqMinInput.value);
                    let max = Number(freqMaxInput.value);
                    if (isNaN(min) || min < 0) min = 0;
                    if (isNaN(max) || max <= min) max = min + 100;
                    freqMinInput.value = min;
                    freqMaxInput.value = max;
                    freqMin.value = min;
                    freqMax.value = max;
                    initSpectrogram();
                };

                const initPlayer = () => {
                    regionsPlugin = RegionsPlugin.create();

                    ws = WaveSurfer.create({
                        container: waveformRef.value,
                        waveColor: '#94a3b8',
                        progressColor: '#3b82f6',
                        cursorColor: '#ef4444',
                        cursorWidth: 2,
                        barWidth: 2,
                        barGap: 1,
                        barRadius: 2,
                        height: 80,
                        dragToSeek: false, // Отключаем, чтобы обрабатывать перетаскивание (Pan) и клик вручную
                        url: audioUrl.value,
                        plugins: [regionsPlugin]
                    });

                    initSpectrogram();

                    ws.on('ready', () => { isAudioReady.value = true; });
                    ws.on('play', () => { isPlaying.value = true; });
                    ws.on('pause', () => { isPlaying.value = false; });
                    ws.on('timeupdate', (time) => { currentTime.value = time; });

                    // Обработка создания региона для Loop на графике
                    regionsPlugin.on('region-created', (region) => {
                        if (activeLoopRegion && activeLoopRegion !== region) {
                            activeLoopRegion.remove();
                        }
                        activeLoopRegion = region;
                        hasActiveLoop.value = true;
                    });

                    regionsPlugin.on('region-updated', () => {
                        clearTimeout(loopTimeout);
                    });

                    regionsPlugin.on('region-clicked', (region, e) => {
                        e.stopPropagation();
                        ws.setTime(region.start);
                        if (!isPlaying.value) ws.play();
                    });
                };

                // Обработка перетаскивания графика (Pan) и клика (Seek) для мыши и тач-экранов
                const onWavePointerDown = (e) => {
                    if (!ws || !isAudioReady.value) return;
                    if (isLoopMode.value) return; // В режиме Loop перетаскивание рисует регион

                    isDraggingWave.value = true;
                    wasDragged = false;
                    pointerStartX = e.clientX;
                    initialScrollLeft = ws.getScroll();
                };

                const onWavePointerMove = (e) => {
                    if (!isDraggingWave.value || isLoopMode.value || !ws) return;
                    const dx = e.clientX - pointerStartX;
                    if (Math.abs(dx) > 5) {
                        wasDragged = true;
                    }
                    if (wasDragged) {
                        ws.setScrollPixels(initialScrollLeft - dx);
                    }
                };

                const onWavePointerUp = (e) => {
                    if (!isDraggingWave.value) return;
                    isDraggingWave.value = false;

                    // Если пользователь просто кликнул/тапнул без перетаскивания — перематываем в эту точку
                    if (!wasDragged && !isLoopMode.value && ws) {
                        const rect = waveformRef.value.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const scrollX = ws.getScroll();
                        const wrapper = ws.getWrapper();
                        const totalWidth = wrapper ? wrapper.scrollWidth : rect.width;
                        const duration = ws.getDuration();

                        if (totalWidth > 0 && duration > 0) {
                            const targetRatio = Math.max(0, Math.min(1, (scrollX + clickX) / totalWidth));
                            ws.setTime(targetRatio * duration);
                        }
                    }
                    wasDragged = false;
                };

                onUnmounted(() => { 
                    clearTimeout(loopTimeout);
                    clearTimeout(zoomRedrawTimer);
                    if (ws) ws.destroy(); 
                    if (audioUrl.value) URL.revokeObjectURL(audioUrl.value);
                });

                const togglePlay = () => { 
                    if (!ws) return;
                    if (isPlaying.value) {
                        ws.pause();
                        clearTimeout(loopTimeout);
                    } else {
                        if (isLoopMode.value && activeLoopRegion) {
                            if (currentTime.value < activeLoopRegion.start || currentTime.value >= activeLoopRegion.end) {
                                ws.setTime(activeLoopRegion.start);
                            }
                        }
                        ws.play();
                    }
                };
                
                const onZoom = (e) => { 
                    if (!ws) return;
                    ws.zoom(Number(e.target.value));
                    // Автоматически перерисовываем АЧХ после завершения движения ползунка зума
                    clearTimeout(zoomRedrawTimer);
                    zoomRedrawTimer = setTimeout(() => {
                        initSpectrogram();
                    }, 300);
                };

                const jumpTo = (time) => {
                    if (ws) {
                        ws.setTime(time);
                        if (!isPlaying.value) ws.play();
                    }
                };

                // Включение / Выключение режима Loop с рисованием региона на графике
                const toggleLoopMode = () => {
                    isLoopMode.value = !isLoopMode.value;
                    clearTimeout(loopTimeout);

                    if (isLoopMode.value) {
                        if (ws && isPlaying.value) ws.pause();
                        if (regionsPlugin) {
                            disableDragSelectionFn = regionsPlugin.enableDragSelection({
                                color: 'rgba(147, 51, 234, 0.35)'
                            });
                        }
                    } else {
                        if (disableDragSelectionFn) {
                            disableDragSelectionFn();
                            disableDragSelectionFn = null;
                        }
                        if (regionsPlugin) {
                            regionsPlugin.clearRegions();
                        }
                        activeLoopRegion = null;
                        hasActiveLoop.value = false;
                    }
                };

                // Логика цветовой маркировки субтитров
                const toggleColorPicker = (id) => {
                    openPickerId.value = openPickerId.value === id ? null : id;
                };

                const closeColorPicker = () => {
                    openPickerId.value = null;
                };

                const setLineColor = (line, colorKey) => {
                    line.color = colorKey;
                    openPickerId.value = null;
                };

                const getColorBarClass = (colorKey) => {
                    const found = colorSwatches.find(s => s.key === (colorKey || ''));
                    return found ? found.barClass : colorSwatches[0].barClass;
                };

                const getLineCardClasses = (line) => {
                    const found = colorSwatches.find(s => s.key === (line.color || '')) || colorSwatches[0];
                    return activeLineId.value === line.id ? found.activeCardClass : found.cardClass;
                };

                const toggleBookmark = (line) => {
                    line.is_bookmarked = !line.is_bookmarked;
                    if (line.is_bookmarked && !line.note) line.note = '';
                };

                const formatTime = (seconds) => {
                    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                    const ms = Math.floor((seconds % 1) * 10).toString();
                    return `${m}:${s}.${ms}`;
                };

                const safeScrollToElement = (id) => {
                    const element = document.getElementById(id);
                    const container = transcriptContainer.value;
                    if (element && container) {
                        const containerRect = container.getBoundingClientRect();
                        const elementRect = element.getBoundingClientRect();
                        const targetTop = container.scrollTop + (elementRect.top - containerRect.top) - (containerRect.height / 2) + (elementRect.height / 2);
                        container.scrollTo({ top: targetTop, behavior: 'smooth' });
                    }
                };

                const executeSearch = () => {
                    hasSearched.value = true;
                    const query = searchQuery.value.trim().toLowerCase();
                    if (!query) {
                        searchResults.value = [];
                        return;
                    }
                    searchResults.value = transcript.value.filter(line => 
                        line.text.toLowerCase().includes(query)
                    );
                    if (searchResults.value.length > 0) {
                        currentSearchIndex.value = 0;
                        navigateToSearchResult();
                    }
                };

                const nextSearch = () => {
                    if (searchResults.value.length === 0) return;
                    currentSearchIndex.value = (currentSearchIndex.value + 1) % searchResults.value.length;
                    navigateToSearchResult();
                };

                const prevSearch = () => {
                    if (searchResults.value.length === 0) return;
                    currentSearchIndex.value = (currentSearchIndex.value - 1 + searchResults.value.length) % searchResults.value.length;
                    navigateToSearchResult();
                };

                const navigateToSearchResult = () => {
                    const targetLine = searchResults.value[currentSearchIndex.value];
                    if (targetLine) {
                        const previousAutoScroll = autoScroll.value;
                        autoScroll.value = false;
                        if (ws && isPlaying.value) ws.pause();
                        
                        nextTick(() => {
                            safeScrollToElement('line-' + targetLine.id);
                            setTimeout(() => { autoScroll.value = previousAutoScroll; }, 500);
                        });
                    }
                };

                const isSearchMatch = (id) => {
                    if (searchResults.value.length === 0) return false;
                    return searchResults.value[currentSearchIndex.value].id === id;
                };

                const exportBookmarks = () => {
                    const dataToSave = transcript.value
                        .filter(l => l.is_bookmarked || l.color)
                        .map(l => ({
                            id: l.id,
                            start: l.start,
                            end: l.end,
                            text: l.text,
                            is_bookmarked: l.is_bookmarked,
                            note: l.note,
                            color: l.color || ''
                        }));
                    const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bookmarks_notes.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };

                const importBookmarks = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedData = JSON.parse(e.target.result);
                            importedData.forEach(importedLine => {
                                const line = transcript.value.find(l => l.id === importedLine.id);
                                if (line) {
                                    line.is_bookmarked = importedLine.is_bookmarked ?? true;
                                    line.note = importedLine.note || '';
                                    line.color = importedLine.color || '';
                                }
                            });
                        } catch (err) {
                            alert("Error reading JSON file. Check format.");
                            console.error(err);
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                };

                const activeLineId = computed(() => {
                    const line = transcript.value.find(l => currentTime.value >= l.start && currentTime.value <= l.end);
                    return line ? line.id : null;
                });

                const bookmarkedLines = computed(() => transcript.value.filter(l => l.is_bookmarked));

                // Слежение за временем для работы Loop по региону и автоскролла
                watch(currentTime, async (newTime) => {
                    if (isLoopMode.value && isPlaying.value && activeLoopRegion) {
                        if (newTime >= activeLoopRegion.end) {
                            ws.pause();
                            loopTimeout = setTimeout(() => {
                                if (isLoopMode.value && activeLoopRegion) {
                                    ws.setTime(activeLoopRegion.start);
                                    ws.play();
                                }
                            }, 1000);
                        }
                    }

                    const currentId = activeLineId.value;
                    if (currentId && autoScroll.value) {
                        await nextTick();
                        safeScrollToElement('line-' + currentId);
                    }
                });

                return {
                    locale,
                    t,
                    toggleLocale,
                    isSessionStarted,
                    audioUrl,
                    audioFileName,
                    jsonFileName,
                    isReadyToStart,
                    isDraggingAudio,
                    isDraggingJson,
                    handleStartAudio,
                    handleStartJson,
                    handleAudioDrop,
                    handleJsonDrop,
                    startSession,
                    transcript,
                    currentTime,
                    isPlaying,
                    isAudioReady,
                    zoomLevel,
                    freqMinInput,
                    freqMaxInput,
                    freqLabels,
                    applyFrequencyRange,
                    waveformRef,
                    transcriptContainer,
                    autoScroll,
                    activeLineId,
                    bookmarkedLines,
                    searchQuery,
                    searchResults,
                    currentSearchIndex,
                    hasSearched,
                    isLoopMode,
                    hasActiveLoop,
                    isDraggingWave,
                    onWavePointerDown,
                    onWavePointerMove,
                    onWavePointerUp,
                    togglePlay,
                    onZoom,
                    jumpTo,
                    toggleLoopMode,
                    colorSwatches,
                    openPickerId,
                    toggleColorPicker,
                    closeColorPicker,
                    setLineColor,
                    getColorBarClass,
                    getLineCardClasses,
                    toggleBookmark,
                    formatTime,
                    executeSearch,
                    nextSearch,
                    prevSearch,
                    isSearchMatch,
                    exportBookmarks,
                    importBookmarks
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
